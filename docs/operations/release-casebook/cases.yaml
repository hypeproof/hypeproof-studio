      - 닫힌 수업 — 이 수업에 참여할 권한이나 진행 중인 세션이 없습니다. 강사에게 참여 등록과 수업 상태를 확인해주세요.
      - 어느 쪽도 영어 오류나 요청 id 만 보여 주지 않는다
