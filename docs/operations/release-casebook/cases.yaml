  # ── CUJ-3 참여 코드로 수업 입장 → 이어하기 ─────────────────────────────────────

  - id: BB-017
    journey: CUJ-3
    priority: P0
    title: 참여 코드로 수업 활동에 들어간다
    requirements: [US-03, US-04, TUX-SP-14]
    steps:
      - 강사가 세션을 연 수업의 참여 코드를 준비한다
      - 시작 카드에서 참여 코드가 있어요 를 누른다
      - 코드를 붙여넣고 코드 확인하기 를 누른 뒤 이 활동 시작하기 를 누른다
    expect:
      - 제목 참여 코드로 시작하기, 입력칸 안내 받은 코드를 여기에 붙여넣으세요, 아래 강사나 운영자에게 받은 코드를 붙여 넣으세요. 가 보인다
      - 확인 뒤 이 활동으로 시작할까요? 카드에 작업 폴더 행이 있다
      - 채팅이 수업 작업 폴더에서 열리고 첫 요청이 처리된다
    origin:
      kind: design
    automated_by: e2e/tests/native-unified-switch.spec.ts
    notes: 세션이 닫혀 있으면 403 이 나온다(.claude/rules/verification.md). 실제 코드가 필요하므로 사람이 한다.

