    notes: StudioJourneyTests.testBackgroundStopsCaptureAndPreservesUnsentDraftAcrossRelaunch 와 testFailedSendRetainsOutboxAndRetriesSameRequestAfterRelaunch. testRecordedFailureRestoresDraftAcrossRelaunchAndExplicitlySendsNewID 와 testRecordedFailureCannotReplaceExistingDraft 는 기록된 실패를 빈 초안으로 가져온 뒤 명시적으로 새 ID 를 보내는 흐름과 초안 충돌을 검사한다. 합성 전송 실패·앱 재실행의 같은 ID 재시도와 서버에 기록된 실패의 새 ID 재전송을 구분한다. testLongHistoryRestoresLatestAcrossRelaunchConversationAndAccountSwitch 와 testEightyMessageWindowFollowsNewTailWithoutInterruptingReading 은 실제 App 의 긴 기록·화면 위치·명시적 후속 질문을 합성 HTTP 로 검사한다. 실제 네트워크 단절·마이크 중단과 서버 중복 방지는 그 실행 환경의 별도 관측으로 기록한다.

