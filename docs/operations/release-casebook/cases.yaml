      - 이어하기는 내려받는 중… 뒤에 그 홈페이지 폴더를 열고, 한 폴더에 저장소가 둘 생기지 않는다
      - 올린 홈페이지가 없으면 이 저장소에는 아직 올린 홈페이지가 없어요. '새로 하기'를 눌러 주세요. 가 나온다
