# 블랙박스 케이스. 여정은 journeys.yaml, 절차와 규칙은 README.md.
# 문구는 2026-10-20 main(f9bde411)의 소스에서 그대로 옮겼다. 출처 파일은 extensions/hypeproof-chat 기준.
# {버전} {금액} {n} {d} 처럼 중괄호로 쓴 부분은 실행 때 실제 값으로 바뀐다.
# 형식 검사와 PyYAML 대조: node --test scripts/release/test/select-cases.test.mjs

cases:
  # ── CUJ-1 처음 설치 → 무료로 첫 결과물 ────────────────────────────────────────────

  - id: BB-001
    journey: CUJ-1
    priority: P0
    title: 한 줄 설치가 끝나고 Studio 가 macOS 차단 없이 열린다
    requirements: [US-01, TUX-COND-02]
    steps:
      - Apple 칩 Mac 의 터미널에 릴리스(또는 릴리스 PR 맨 위)의 curl -fsSL …/install-mac.sh | bash 한 줄을 붙여넣고 Enter
      - 설치 출력이 끝날 때까지 기다린다
      - 안내대로 Studio 를 연다 (rc 는 START-{버전}.command, 안정 버전은 ~/Applications/HypeProof Studio.app)
    expect:
      - 출력에 HypeProof Studio {버전} 내려받는 중 (약 170MB), SHA-256 확인, AI 코치 실행 파일(…) 준비하는 중 (약 110MB) 줄이 차례로 나온다 (scripts/release/templates/install-mac.sh)
      - 마지막에 HypeProof Studio {버전} 설치를 마쳤습니다. 와 1. Studio를 엽니다. 참여 코드는 필요 없습니다. 가 나온다
      - Studio 가 열린다. macOS 의 열 수 없음/확인되지 않은 개발자 경고 창이 뜨지 않는다
    origin:
      kind: escaped-bug
      date: "2026-10-20"
      ref: "#2096"
    notes: 브라우저로 받은 zip 은 격리 표시가 붙어 Gatekeeper 가 막았다. curl 로 받은 파일에는 표시가 붙지 않는다. scripts/release/test/install-kit.test.mjs 는 스크립트 생성만 검사하고 실제 설치는 하지 않는다.

  - id: BB-002
    journey: CUJ-1
    priority: P1
    title: 릴리스 안내가 브라우저 zip 이 아니라 한 줄 설치를 먼저 준다
    requirements: [US-01, TUX-COND-02]
    steps:
      - 릴리스 페이지(GitHub Release 본문)를 연다
      - 같은 릴리스의 HypeProof-{태그}-Test-Kit.zip 안 READ-ME 를 연다
    expect:
      - 릴리스 본문의 설치 절이 Install this exact build on a Mac (Apple Silicon) 아래 curl 한 줄로 시작한다
      - READ-ME 첫 안내가 가장 쉬운 설치 (권장)로 시작하는 한 줄 설치다
      - 'READ-ME 의 주의에 - macOS가 .command 파일을 열지 못하게 막으면 보안 설정을 바꾸거나 우회하지 마세요. 가 있다'
      - 어느 안내도 보안 설정의 확인 없이 열기 로 우회하라고 하지 않는다
    origin:
      kind: escaped-bug
      date: "2026-10-20"
      ref: "#2096"
    notes: docs/INSTALL.md 31행은 아직 확인 없이 열기 를 안내한다(이 케이스 기준으로는 FAIL 대상 문서). scripts/release/install-kit.mjs 가 READ-ME 와 본문 절을 만든다.

  - id: BB-003
    journey: CUJ-1
    priority: P1
    title: 회원 설치 스크립트가 zsh 계정의 PATH 를 .zprofile 에 쓴다
    requirements: [PRA-14]
    steps:
      - 로그인 셸이 zsh 인 Mac 계정에서 회원·Lab 설치 경로(bash 로 scripts/install.sh 실행)를 돌린다
      - 출력의 이 컴퓨터 확인 단계를 읽는다
      - 끝난 뒤 ~/.zprofile 과 ~/.bash_profile 을 비교한다
    expect:
      - '출력에 로그인 셸 zsh (PATH 설정 파일: /Users/{사용자}/.zprofile) 줄이 있다 (scripts/install.sh)'
      - PATH 줄은 ~/.zprofile 에 들어가고 ~/.bash_profile 에는 새로 생기지 않는다. ~/.zshrc 에 이미 있는 줄은 중복되지 않는다
      - 끝에 HypeProof Studio 설치가 끝났습니다. 와 Studio를 열었습니다. 시작 화면에서 바로 시작하세요. 가 나오고 Studio 가 열린다
    origin:
      kind: escaped-bug
      date: "2026-10-20"
      ref: "#2137"
    automated_by: scripts/test-installer-rc.sh
    notes: 릴리스 한 줄 설치(install-mac.sh)는 셸 설정 파일을 건드리지 않는다. 이 분기는 scripts/install.sh 에만 있다. 사전 테스터는 셸 설정 파일을 만질 수 없으므로 사람이 한다.

  - id: BB-004
    journey: CUJ-1
    priority: P0
    title: 처음 열면 코드·로그인 없이 바로 시작 카드가 나온다
    requirements: [REQ-STUDIO-FREE-START, TUX-SP-14, US-04, US-19]
    steps:
      - 새 프로필로 Studio 를 처음 연다 (인터넷 연결됨)
      - 시작 카드를 읽는다
      - 네, 만 14세 이상입니다 를 누른다
    expect:
      - 제목 바로 시작할 수 있습니다, 본문 로그인 없이 바로 시작합니다., 질문 만 14세 이상인가요? 가 보인다 (src/freeStart.ts)
      - 아래쪽 링크로 참여 코드가 있어요 와 이용권으로 시작하기 가 있다. Google 버튼은 없다
      - 화면 어디에도 체험 이라는 말과 남은 횟수가 없다
      - 누르면 작업 공간을 준비하고 있습니다. 가 잠깐 보이고, 미리보기·폴더 선택 없이 채팅이 작업 폴더(~/HypeProofTrial 또는 -2, -3)에서 열린다
    origin:
      kind: design
    automated_by: e2e/trial-ux/run.mjs
    notes: e2e/trial-ux 는 호스트를 흉내 낸 브라우저 하네스다. 실제 Service 의 /v1/free/claim 과 패키징된 앱은 이 케이스만 본다.

  - id: BB-005
    journey: CUJ-1
    priority: P0
    title: 무료 시작이 수업이 묶은 폴더에서 멈추지 않고 다음 번호 폴더로 들어간다
    requirements: [REQ-STUDIO-FREE-START, US-09]
    steps:
      - 준비 — 같은 프로필에서 참여 코드로 수업 활동을 시작해 ~/HypeProofTrial 을 그 수업에 묶고, 파일 하나를 만든 뒤 Studio 를 닫는다
      - 무료 시작 카드가 다시 나오게 한 뒤(새 설치 id 또는 수업 연결 해제) 바로 시작하기 를 누른다
      - 채팅에 첫 메시지를 보낸다
    expect:
      - 이 폴더는 다른 활동에 연결돼 있습니다. 다른 작업 폴더를 선택해 주세요. 가 나오지 않는다 (src/activityConnections.ts)
      - 오류·질문·추가 버튼 없이 채팅이 ~/HypeProofTrial-2 에서 열린다
      - ~/HypeProofTrial 의 수업 파일은 그대로 있다
    origin:
      kind: escaped-bug
      date: "2026-10-20"
      ref: "#2094"
    automated_by: extensions/hypeproof-chat/test/free-start-folder.smoke.mjs
    notes: 첫 메시지 전에 이 폴더에서 작업할까요? (src/folderConsent.ts, REQ-STUDIO-FOLDER-CONSENT)가 뜨는지 메모에 적는다. -N 폴더는 자기 폴더로 보지 않는 코드라 뜰 수 있고, 그러면 PR 2094 의 묻지 않는다 와 겹친다. 판정은 Jay. 실제 코드가 필요하므로 사람이 한다.

  - id: BB-006
    journey: CUJ-1
    priority: P1
    title: 예전 코드 체험이 쓰던 기본 폴더는 무료 시작이 그대로 이어받는다
    requirements: [REQ-STUDIO-FREE-START]
    steps:
      - 준비 — 같은 프로필에서 예전 코드 체험(studio-native-trial)으로 ~/HypeProofTrial 을 쓴 기록을 남긴다
      - 무료 시작 카드에서 바로 시작하기 를 누른다
    expect:
      - 채팅이 ~/HypeProofTrial 에서 열린다 (-2 로 가지 않는다). 오류 문구가 없다
      - 예전 파일이 작업 폴더에 보인다
    origin:
      kind: escaped-bug
      date: "2026-10-20"
      ref: "#2094"
    automated_by: extensions/hypeproof-chat/test/free-start-folder.smoke.mjs

  - id: BB-007
    journey: CUJ-1
    priority: P0
    title: 무료 채팅의 첫 요청이 페이지를 만들고 카드에서 열린다
    requirements: [REQ-STUDIO-PAGE-CARD, CGP-ART-R-010]
    steps:
      - BB-004 로 열린 채팅에 간단한 자기소개 홈페이지 만들어줘 를 보낸다
      - 답이 끝날 때까지 기다린다
      - 카드의 열기 를 누른다
    expect:
      - 답 아래에 이번 답에서 바뀐 페이지 카드가 나오고 행에 새로 만듦 이 있다 (src/pageCard.ts)
      - 카드에 열기 와 폴더에서 보기 가 있다
      - 열기 를 누르면 Studio 안 미리보기로 페이지가 열리고, 파일이 작업 폴더에 있다
    origin:
      kind: design
    notes: verify-unified-release 의 자동 E2E 는 코드 좌석으로 대화하며 이 카드를 재지 않는다.

  - id: BB-008
    journey: CUJ-1
    priority: P1
    title: 만 14세 미만은 시작하지 않고 보호자 안내를 받는다
    requirements: [TUX-SP-15]
    steps:
      - 새 프로필의 시작 카드에서 아니요, 만 14세 미만입니다 를 누른다
    expect:
      - 보호자와 함께 시작해 주세요 와 만 14세 미만은 보호자의 동의가 있어야 사용할 수 있습니다. 로 시작하는 본문이 보인다
      - 보호자 안내 보기 ↗ 링크가 있고, 참여 코드가 있어요 는 남아 있다
      - 채팅이 열리지 않는다
    origin:
      kind: design
    automated_by: e2e/trial-ux/run.mjs

  - id: BB-009
    journey: CUJ-1
    priority: P1
    title: 인터넷이 끊긴 채 바로 시작하기 를 누르면 다시 누를 수 있게 안내한다
    requirements: [TUX-SP-14, US-12]
    steps:
      - Wi-Fi 를 끈다
      - 시작 카드에서 시작 버튼을 누른다
      - Wi-Fi 를 다시 켜고 한 번 더 누른다
    expect:
      - 연결하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요. 가 보이고 시작 버튼이 남아 있다 (src/freeStart.ts)
      - 다시 연결한 뒤 누르면 채팅이 열린다
    origin:
      kind: design
    automated_by: e2e/trial-ux/run.mjs

  - id: BB-010
    journey: CUJ-1
    priority: P2
    title: rc 한 줄 설치는 기존 Studio 와 프로필을 건드리지 않는다
    requirements: [TUX-COND-02]
    steps:
      - 안정 버전 Studio 가 ~/Applications 또는 /Applications 에 있는 Mac 에서 rc 의 한 줄 설치를 돌린다
      - 설치 출력과 ~/Applications 를 확인한다
      - 기존 Studio 를 연다
    expect:
      - 출력에 프로필 줄과 (기존 HypeProof Studio와 따로 저장됩니다) 가 있다 (install-mac.sh)
      - rc 는 ~/Applications/{kit 폴더}/HypeProof Studio.app 에 깔리고 START-{버전}.command 가 옆에 있다
      - 기존 앱의 버전·활동·대화가 그대로다
    origin:
      kind: design
    automated_by: scripts/release/test/install-kit.test.mjs

  - id: BB-026
    journey: CUJ-1
    priority: P1
    title: Windows x64 설치본도 무료 시작 카드까지 간다
    requirements: [PRA-09, REQ-STUDIO-FREE-START, TUX-SP-14]
    steps:
      - Windows 11 x64 PC 에서 rc 릴리스의 Windows x64 설치 파일(UserSetup x64 .exe)을 받아 실행한다
      - SmartScreen 경고가 뜨면 추가 정보 → 실행 을 누르고 설치를 마친다
      - 시작 메뉴에서 HypeProof Studio 를 연다
    expect:
      - 설치가 끝나고 Studio 가 열린다
      - BB-004 와 같은 시작 카드(바로 시작할 수 있습니다, 로그인 없이 바로 시작합니다., 만 14세 이상인가요?)가 나온다
      - 네, 만 14세 이상입니다 를 누르면 채팅이 작업 폴더에서 열린다
    origin:
      kind: design
    notes: Windows 는 2026-10-20(#2139)부터 다시 출시한다. 설치 파일은 서명되지 않아 SmartScreen 경고가 정상이다(scripts/install-win.ps1). 사전 테스터는 Mac 에서만 돌므로 사람이 한다.

  # ── CUJ-2 무료 사용량 소진 → Google 로그인으로 이용권 구매 ────────────────────────

  - id: BB-011
    journey: CUJ-2
    priority: P0
    title: 무료 사용량이 끝나면 파일이 남아 있다고 알리고 이용권은 사람이 열게 한다
    requirements: [TUX-COND-07, REQ-L12, AB-13]
    steps:
      - 무료 좌석에서 무료 사용량을 다 쓴다 (허용량이 작은 검증용 Service 또는 실제 소진)
      - 채팅에 나온 카드를 읽는다
    expect:
      - 카드 제목 무료 사용량을 모두 썼습니다 (시간 만료면 무료 사용 시간이 끝났습니다) (src/trialEndCard.ts)
      - 본문 만든 파일은 작업 폴더에 그대로 있습니다. 대화도 계속 볼 수 있습니다. / 이어서 작업하려면 이용권이 필요합니다. / 한 번만 결제하며 자동으로 다시 결제되지 않습니다.
      - 버튼 이용권 살펴보기 와 오늘은 여기까지. 이용권 화면이 저절로 열리지 않는다
      - 작업 폴더의 파일이 그대로 있다
    origin:
      kind: design
    automated_by: e2e/trial-ux/run.mjs

  - id: BB-012
    journey: CUJ-2
    priority: P0
    title: 로그인하지 않은 무료 좌석의 이용권 목록은 Google 로그인만 앞에 둔다
    requirements: [TUX-SP-17, REQ-L12, REQ-STUDIO-FREE-START]
    steps:
      - BB-011 카드에서 이용권 살펴보기 를 누른다
    expect:
      - 제목 어떤 이용권으로 시작할까요? 와 AI 요청 {n}번 · {d}일 동안 행, 추천 표시가 보인다
      - 목록 아래 이용권을 사려면 Google로 로그인해 주세요. 와 주 버튼 Google로 시작하기 하나만 있다 (src/passPurchase.ts)
      - 결제하러 가기 버튼과 결제하는 분이 만 19세 이상인가요? 질문이 아직 없다
      - 나가는 링크는 돌아가기 다 (시작 방법 다시 선택 이 아니다)
    origin:
      kind: design
    automated_by: e2e/trial-ux/run.mjs
    notes: 계정 기능이 꺼진 빌드나 Service 에서는 결제는 Google 로그인과 함께 열려요. 잠시 뒤 다시 확인해 주세요. 가 나오고 익명 결제로 넘어가지 않아야 한다.

  - id: BB-013
    journey: CUJ-2
    priority: P0
    title: Google 로그인 → 결제 → 돌아오면 같은 작업 폴더에서 이용권으로 이어진다
    requirements: [TUX-SP-17, REQ-L12, AB-14]
    steps:
      - BB-012 에서 Google로 시작하기 를 누르고 브라우저에서 Google 로그인과 Studio 연결 승인을 마친다
      - 결제하는 분이 만 19세 이상인가요? 에 네 를 누르고 {금액} 결제하러 가기 를 누른다
      - 브라우저에서 결제를 마치고 Studio 로 돌아온다
      - 채팅에 요청 하나를 보낸다
    expect:
      - 로그인 중 브라우저에서 Google 로그인 후 이 Studio 연결을 승인해 주세요. 가 보인다 (src/accountSession.ts)
      - 결제 중 브라우저에서 결제를 기다리고 있어요, 결제 뒤 결제를 확인했어요. 이용권을 넣고 있어요. 가 보인다
      - 같은 작업 폴더와 대화로 돌아오고 예전 파일이 있다. 요청이 처리된다
      - 브라우저에서 돌아온 것만으로 이용권이 생기지 않는다 (결제 확인 뒤에만 연결)
    origin:
      kind: design
    notes: 실제 Google 계정과 결제가 필요하다. 사전 테스터는 Google 로그인 화면에서 멈추고 BLOCKED 로 적는다.

  - id: BB-014
    journey: CUJ-2
    priority: P1
    title: 결제를 기다리는 중에 Studio 를 닫아도 주문이 남는다
    requirements: [REQ-L12]
    steps:
      - BB-013 의 브라우저에서 결제를 기다리고 있어요 화면에서 Studio 를 종료한다
      - 브라우저에서 결제를 마친다
      - Studio 를 다시 연다
