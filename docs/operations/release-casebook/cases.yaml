    notes: e2e/update-check 는 배너와 확인만 재고 설치는 하지 않는다. 안정 태그 공개 뒤에만 할 수 있으므로 rc PR 에서는 직전 rc 끼리가 아니라 공개 직후 확인으로 남긴다.

