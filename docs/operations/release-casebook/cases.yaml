  - id: BB-025
    journey: CUJ-4
    priority: P1
    title: 무료 좌석의 수동 업데이트 확인은 조용히 최신이라고 하지 않는다
    requirements: [REQ-I14, REQ-I15, TUX-COND-02]
    steps:
      - 회원 자격(gh 로그인·토큰)이 없는 Mac 의 무료 좌석에서 업데이트 확인을 직접 실행한다
    expect:
      - 공개 최신 릴리스를 찾거나, 이 Studio에서는 앱 안에서 새 버전을 확인할 수 없어요. 새 버전은 홈페이지에서 받을 수 있어요. 와 홈페이지 열기 가 나온다
      - 익명 확인 제한이면 지금은 새 버전을 확인할 수 없어요. 한 시간쯤 뒤에 다시 확인해 주세요. 가 나온다
      - gh auth login, 토큰, 체험 이라는 말이 나오지 않는다
    origin:
      kind: design
