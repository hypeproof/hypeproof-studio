  - id: BB-022
    journey: CUJ-4
    priority: P0
    title: 앱 안 업데이트 뒤에도 활동·파일·대화가 그대로다
    requirements: [REQ-I2, REQ-I4, REQ-I13, US-10]
    steps:
      - 직전 안정 버전을 그 버전의 한 줄 설치로 깐다 (rc 키트가 아니라 앱 배치. 키트는 업데이트를 끈다)
      - 활동을 시작해 파일과 대화를 남긴다
      - 새 안정 버전이 공개된 뒤 업데이트 배너를 기다리거나 수동 확인을 한다
      - 업데이트 를 누르고 재시작하고 업데이트 를 누른다
    expect:
      - 배너 새 버전 v{버전} 나왔어요 · {크기} 와 업데이트하면 자동으로 재시작됩니다. 작업 중인 내용은 미리 저장해주세요. (webview-ui/src/ChatPanel.tsx)
      - 창 v{버전} 설치 준비 완료. 지금 재시작하면 업데이트가 적용됩니다. 와 재시작하고 업데이트 / 나중에 (src/updateChecker.ts)
      - 새 버전으로 다시 열리고 같은 활동, 작업 폴더의 파일, 앞선 대화가 그대로다
    origin:
