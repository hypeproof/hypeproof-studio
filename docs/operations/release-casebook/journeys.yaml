# 핵심 사용자 여정(CUJ). 블랙박스 케이스(cases.yaml)는 모두 이 중 하나에 매달린다.
# 절차: README.md. 형식 검사: node --test scripts/release/test/select-cases.test.mjs
#
# 근거 (2026-10-20 main 기준):
#   CUJ-1  REQ-STUDIO-FREE-START, TUX-SP-14/15/16, US-04, US-19 / scripts/release/templates/install-mac.sh
#   CUJ-2  TUX-SP-17, TUX-COND-07, REQ-L12, AB-13, AB-14
#   CUJ-3  US-03, US-04, US-09, US-10, US-12, REQ-P4
#   CUJ-4  REQ-I2, REQ-I3, REQ-I4, REQ-I13 to REQ-I16, US-13, TUX-COND-02, REQ-STUDIO-AUTO-UPDATE
#   CUJ-5  REQ-STUDIO-PREVIEW-FOLLOW, REQ-STUDIO-PREVIEW-RECOVERY (2026-11-03: a member's localhost
#          preview could not be seen by the coach, #3425 — the core "make a page" loop had no journey)
#   CUJ-6  REQ-STUDIO-REPORT-LOGS, REQ-STUDIO-FEEDBACK-ENTRY (2026-11-03: the report path is how
#          escaped bugs reach us; it was untested end to end, #3426)
#   CUJ-7  REQ-STUDIO-TURN-RESTORE (2026-11-03: undo turned off on every turn for a member whose work
#          folder had many files, #3427 — reviewing and undoing the AI's changes had no journey)
# 요구사항 문서에 다른 핵심 여정이 있는지도 봤다. Windows 설치(PRA-09, PRA-12, REQ-I9)는 별도 여정이 아니라
# CUJ-1 의 다른 입구로 둔다: config/release-platforms.json 이 2026-10-20(#2139)부터 win32-x64 를 다시 출시하고,
# 설치 뒤 시작 화면은 같은 코드다(BB-026). 강사 Chalk 는 별도 표면(chalk.hypeproof-ai.xyz)이라 앱 릴리스 여정이 아니다.

journeys:
  - id: CUJ-1
    title: 처음 설치 → 무료로 첫 결과물
    goal: 처음 쓰는 사람이 한 줄 설치로 Studio 를 깔고, 코드·로그인 없이 바로 시작해 AI 와 함께 첫 페이지를 만든다.
    entry: 터미널에 릴리스 한 줄 설치 명령을 붙여넣는다.
    done_when: 채팅에서 만든 페이지가 작업 폴더에 생기고 Studio 안에서 열린다.

  - id: CUJ-2
    title: 무료 사용량 소진 → Google 로그인으로 이용권 구매
    goal: 무료 사용이 끝난 사람이 만든 파일을 잃지 않고, Google 로그인 후 이용권을 사서 같은 작업을 이어간다.
    entry: 무료 좌석에서 무료 사용량이나 시간이 끝난다.
    done_when: 결제 후 같은 작업 폴더와 대화로 돌아와 다음 요청이 처리된다.

  - id: CUJ-3
    title: 참여 코드로 수업 입장 → 이어하기
    goal: 수업 참여자가 받은 코드로 활동에 들어가고, 다시 열었을 때 같은 활동과 파일로 이어서 한다.
    entry: 시작 화면에서 참여 코드가 있어요 를 누른다.
    done_when: 앱을 다시 열어 이어서 하기 로 같은 대화와 파일에 돌아온다.

  - id: CUJ-4
    title: 업데이트해도 작업이 남는다
    goal: 새 버전이 나왔을 때 사용자가 앱 안에서 업데이트하고, 재시작 뒤에도 활동·파일·대화가 그대로다.
    entry: 이전 안정 버전이 깔린 Mac 에 새 안정 버전이 공개된다.
    done_when: 새 버전으로 재시작한 뒤 같은 활동·파일·대화가 보인다.

  - id: CUJ-5
    title: 만든 페이지를 미리보기로 열고 코치와 같은 화면을 본다
    goal: 사용자가 만든 웹 페이지를 Studio 에서 띄운 로컬 서버(localhost)로 열고, 코치가 그 서버가 보여 주는 파일과 화면을 사용자와 똑같이 확인해 고친다.
    entry: 작업 폴더에 페이지가 있고, 채팅에서 미리보기 서버를 띄워 달라고 하거나 이미 떠 있다.
    done_when: 코치가 서버가 보여 주는 파일 이름을 말하고 그 화면을 기준으로 고친 결과가 같은 주소에서 보인다.

  - id: CUJ-6
    title: 불편하거나 고장 나면 앱 안에서 보내고 운영팀이 원인을 안다
    goal: 사용자가 오류든 단순한 불편이든 앱 안에서 두 번 클릭으로 보내고, 운영팀이 받은 신고만으로 원인을 찾는다.
    entry: 채팅의 대화 메뉴 또는 오류 카드.
    done_when: 신고가 운영팀에 도착하고, 붙은 기록에 실제 원인 줄이 남아 있다.

  - id: CUJ-7
    title: AI 가 바꾼 파일을 확인하고 되돌린다
    goal: 사용자가 AI 요청 뒤 바뀐 파일 목록을 보고, 원하면 요청 전으로 되돌린다. 작업 폴더가 커도 된다.
    entry: AI 가 작업 폴더의 파일을 쓰거나 고친 요청이 끝난다.
    done_when: 되돌리기 뒤 바뀐 파일이 요청 전 내용이고, 새로 만든 파일은 없다.

  - id: CUJ-8
    title: iPhone 에서 계정으로 시작 → 내 이야기에 답변 → 다음 질문
    goal: 컴퓨터가 꺼져 있어도 iPhone 에서 자신이 원하고 고민하는 것을 말하거나 적고, 답변을 받으며 생각을 발전시킨다. 중단하거나 실패해도 보낸 말과 초안이 남는다.
    entry: iPhone 의 질문 탭에서 내 계정으로 시작하기 를 누른다.
    done_when: 같은 기기에서 로그인을 마치고 첫 답변을 받는다. 음성 대화는 다음 말을 기다리고, 음성 멈춤 이나 앱 이탈 뒤에는 멈춘다. 실패 이유와 재시도할 글을 잃지 않는다.
