# Staging Chalk uses the staging Service HTTP origin; it has no shared storage.
name = "hypeproof-chalk-staging"
main = "src/index.ts"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
account_id = "f1da7073b98021b4117c82a4a219eef0"
workers_dev = true

[observability]
enabled = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
ENVIRONMENT = "staging"
HPS_SERVICE_ORIGIN = "REPLACE_WITH_STAGING_SERVICE_ORIGIN"
