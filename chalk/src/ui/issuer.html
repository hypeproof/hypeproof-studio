.sub,p.sub,header>p,header p{font-size:var(--ds-c-chalk-issuer-type-28);color:var(--hp-mute);margin:0 0 var(--ds-c-chalk-issuer-space-1);max-width:60ch}

<div class="wrap">
  <h1>학생 초대</h1>
  <div class="sub">학생이 앱에 입력할 참여 코드를 발급합니다.</div>

  <fieldset>
    <legend>강사 연결</legend>
    <!--@chalk-connect-->
  </fieldset>

  <fieldset>
    <legend>초대할 학생</legend>
    <label>학생 ID (영문 소문자·숫자·하이픈)</label>
    <input id="u" placeholder="participant-01">
    <label>수업 ID</label>
    <input id="c" placeholder="dental-pilot-2026-a">
    <label>수업 설정 ID</label>
    <input id="p" placeholder="dental-teaser-2026-s1">
    <label>사용 시간</label>
    <input id="hours" type="number" min="1" max="1440" value="12">
    <div class="help">로컬 데모: 6시간. 1회차 + 디버깅 여유까지: 12-24시간.</div>
    <button id="mint">발급 →</button>
  </fieldset>

  <div id="result"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// Server errors come back as one human-ish string. Map known phrases to
// actionable Korean. Unknown errors pass through as `알 수 없는 오류: <raw>`.
function mapServerError(raw) {
  const e = String(raw || "").toLowerCase();
  // Chalk's own connection refusals are already Korean and actionable.
  if (/연결/.test(e)) return String(raw);
  if (e.includes("invalid signature") || e.includes("signature mismatch") || e.includes("malformed")) {
    return "강사 연결 정보를 확인하지 못했어요. 위의 ‘다시 연결’을 눌러주세요.";
  }
  if (e.includes("expired") || e.includes("connection_expired")) {
    return "강사 연결이 만료됐어요. 위의 ‘다시 연결’을 눌러주세요.";
  }
  if (e.includes("revoked")) {
    return "이 강사 연결은 무효화됐어요. ‘다시 연결’을 눌러주세요.";
  }
  if (e.includes("not an issuer")) {
    return "강사 권한이 아닌 연결이에요. ‘다시 연결’을 눌러주세요.";
  }
  if (e.includes("not scoped")) {
    return "연결할 때 고르지 않은 cohort/profile 조합이에요. 이름 오타가 없는지 확인하고, 필요하면 ‘다시 연결’에서 이 수업을 골라주세요.";
  }
  if (e.includes("exceeds scope max")) {
    return "본인 최대 발급 시간을 초과했어요. 위의 hours 칸을 줄여주세요 (보통 12시간 이하).";
  }
  if (e.includes("unsupported token version")) {
    return "강사 연결의 버전이 안 맞아요. ‘다시 연결’을 눌러주세요.";
  }
  if (e.includes("u (user handle) required") || e.includes("c (cohort) required") || e.includes("p (profile) required")) {
    return "학생 정보(handle/cohort/profile)를 다시 확인해주세요.";
  }
  if (e.includes("hours must be")) {
    return "hours 는 1 이상 1440 (60일) 이하 숫자여야 해요.";
  }
  return "알 수 없는 오류: " + raw + " — 같은 오류가 반복되면 운영진에게 알려주세요.";
}

// Minimal HTML escape — error strings can echo user input.
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// The page holds no instructor token: Chalk takes the issuer from the Lab login
// session. Disconnecting is local to this browser: an already issued student token
// is not revoked. It discards this generation's late UI updates and frees the button.
let mintGeneration = 0;
globalThis.chalkConnection?.onChange((c) => {
  if (c.connected) return;
  mintGeneration++;
  $("result").innerHTML = "";
  $("mint").disabled = false;
  $("mint").textContent = "발급 →";
});

$("mint").onclick = async () => {
  const u = $("u").value.trim();
  const c = $("c").value.trim();
  const p = $("p").value.trim();
  const hours = parseInt($("hours").value, 10);
  const result = $("result");
  result.innerHTML = "";

  const conn = globalThis.chalkConnection?.current;
  if (!conn || !conn.connected) {
    return (result.innerHTML = '<div class="err">위의 ‘Lab 로그인으로 연결’을 눌러 강사 권한을 먼저 연결해주세요.</div>');
  }
  if (!u || !c || !p) {
    return (result.innerHTML = '<div class="err">student handle / cohort / profile 모두 필요합니다.</div>');
  }
  if (!hours || hours < 1 || hours > 1440) {
    return (result.innerHTML = '<div class="err">hours 는 1..1440 사이여야 합니다.</div>');
  }

  const generation = ++mintGeneration;
  $("mint").disabled = true;
  $("mint").textContent = "발급 중…";
  try {
    const res = await fetch("/admin/tokens/issue", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ u, c, p, hours }),
    });
    const body = await res.json().catch(() => ({}));
    if (generation !== mintGeneration) return;
    if (!res.ok) {
      const e = body.error;
      const rawError = (typeof e === "string" ? e : e && e.message) || ("HTTP " + res.status);
      const friendly = mapServerError(rawError);
      result.innerHTML =
        '<div class="err">' + esc(friendly) +
        '<div class="help" style="margin-top:var(--ds-c-chalk-issuer-space-2);opacity:0.7">원본 오류: ' + esc(rawError) + '</div>' +
        '</div>';
      return;
    }
    const expISO = new Date(body.exp * 1000).toLocaleString();
    result.innerHTML =
      '<div class="out">' +
      '<h3>✓ 발급 완료 — ' + esc(u) + ' (' + esc(c) + ')</h3>' +
      '<div class="token" id="tok">' + esc(body.token) + '</div>' +
      '<div class="meta">jti: ' + esc(body.jti) + ' · 만료: ' + esc(expISO) + ' · 유효: ' + esc(String(hours)) + 'h</div>' +
      '<button id="copy-token" type="button">토큰 복사</button>' +
      '</div>';
    $('copy-token').onclick=()=>window.chalkCopyFeedback($('copy-token'),()=>document.getElementById('tok')?.textContent??'');
  } catch (err) {
    if (generation === mintGeneration) {
      result.innerHTML = '<div class="err">네트워크 오류: ' + esc(String(err)) + '</div>';
    }
  } finally {
    if (generation === mintGeneration) {
      $("mint").disabled = false;
      $("mint").textContent = "발급 →";
    }
  }
};

// Expose for tests (only when running in a Node test harness — window is
// undefined there).
if (typeof window === "undefined") {
  // eslint-disable-next-line no-undef
  (globalThis).__issuerPageHelpers = { mapServerError };
}
</script>
