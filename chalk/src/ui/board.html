<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HypeProof — 강사 라이브 보드</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  Instructor live board (plan task G, #674). Read this before changing a column:

  · EVERY seat gets a row, always. A quiet seat is the one you most want to
    see, and a "recent N rows" list is exactly where it disappears first.
  · The FIRST column is time-since-last-turn. Ahead of every performance number.
  · Two seconds, on a phone, while walking. Worst rows float to the top.
  · ZERO prompt text. Not a preview column, not a truncated one, not a hover
    tooltip. PIPA Art. 22-2 (verified guardian consent under 14) is why this
    surface is shippable for minor cohorts at all — metadata only is the whole
    licence. A "recent question preview" column is the most tempting feature
    here and it crosses that line. Refuse it.
-->
<style>
  :root {
    --bg: var(--ds-c-chalk-board-surface-72); --fg: var(--ds-c-chalk-board-ink-44); --muted: var(--ds-c-chalk-board-ink-71); --line: var(--ds-c-chalk-board-boundary-64);
    --accent: var(--ds-c-chalk-board-ink-25); --card: var(--ds-c-chalk-board-ink-72);
    --ok: var(--ds-c-chalk-board-ink-73); --watch: var(--ds-c-chalk-board-ink-74); --alert: var(--ds-c-chalk-board-ink-75); --unknown: var(--ds-c-chalk-board-ink-76);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: var(--ds-c-chalk-board-space-20) var(--ds-c-chalk-board-space-1) var(--ds-c-chalk-board-space-39);
    background: var(--bg); color: var(--fg);
    font-family: var(--ds-c-chalk-board-font-9);
    line-height: var(--ds-c-chalk-board-typography-6);
  }
  .wrap { max-width: var(--ds-c-chalk-board-size-102); margin: 0 auto; }
  h1 { font-size: var(--ds-c-chalk-board-type-14); margin: 0 0 var(--ds-c-chalk-board-space-14); }
  .sub { color: var(--muted); font-size: var(--ds-c-chalk-board-type-1); margin-bottom: var(--ds-c-chalk-board-space-19); }
  textarea, input {
    width: 100%; padding: var(--ds-c-chalk-board-space-24) var(--ds-c-chalk-board-space-53); font: inherit; font-size: var(--ds-c-chalk-board-type-9);
    background: var(--card); color: var(--fg);
    border: var(--ds-c-chalk-board-size-3) solid var(--line); border-radius: var(--ds-c-chalk-board-radius-3);
  }
  textarea { font-family: var(--ds-c-chalk-board-font-7); font-size: var(--ds-c-chalk-board-type-3); resize: vertical; }
  label { display: block; font-size: var(--ds-c-chalk-board-type-3); color: var(--muted); margin: var(--ds-c-chalk-board-space-2) 0 var(--ds-c-chalk-board-space-11); }
  button {
    width: 100%; margin-top: var(--ds-c-chalk-board-space-7); padding: var(--ds-c-chalk-board-space-53);
    border: 0; border-radius: var(--ds-c-chalk-board-radius-3); cursor: pointer; font: inherit; font-weight: var(--ds-c-chalk-board-typography-7);
    background: var(--accent); color: var(--ds-c-chalk-board-ink-2);
  }
  button.ghost { background: transparent; color: var(--muted); border: var(--ds-c-chalk-board-size-3) solid var(--line); font-weight: var(--ds-c-chalk-board-typography-12); }
  fieldset { border: var(--ds-c-chalk-board-size-3) solid var(--line); border-radius: var(--ds-c-chalk-board-radius-10); padding: var(--ds-c-chalk-board-space-19); margin: 0 0 var(--ds-c-chalk-board-space-19); }
  legend { padding: 0 var(--ds-c-chalk-board-space-15); color: var(--muted); font-size: var(--ds-c-chalk-board-type-3); }
  .banner { padding: var(--ds-c-chalk-board-space-7) var(--ds-c-chalk-board-space-1); border-radius: var(--ds-c-chalk-board-radius-10); font-size: var(--ds-c-chalk-board-type-1); margin-bottom: var(--ds-c-chalk-board-space-7); }
  .banner.err { background: var(--ds-c-chalk-board-surface-91); border: var(--ds-c-chalk-board-size-3) solid var(--ds-c-chalk-board-boundary-65); color: var(--ds-c-chalk-board-ink-77); }
  .banner.warn { background: var(--ds-c-chalk-board-surface-92); border: var(--ds-c-chalk-board-size-3) solid var(--ds-c-chalk-board-boundary-66); color: var(--ds-c-chalk-board-ink-78); }
  .summary { display: flex; gap: var(--ds-c-chalk-board-space-2); flex-wrap: wrap; margin: var(--ds-c-chalk-board-space-13) 0 var(--ds-c-chalk-board-space-1); }
  .pill {
    padding: var(--ds-c-chalk-board-space-15) var(--ds-c-chalk-board-space-53); border-radius: var(--ds-c-chalk-board-radius-15); font-size: var(--ds-c-chalk-board-type-1); font-weight: var(--ds-c-chalk-board-typography-7);
    border: var(--ds-c-chalk-board-size-3) solid var(--line); background: var(--card); font-variant-numeric: tabular-nums;
  }
  .pill.alert { border-color: var(--ds-c-chalk-board-boundary-65); color: var(--alert); }
  .pill.watch { border-color: var(--ds-c-chalk-board-boundary-66); color: var(--watch); }
  .pill.ok { border-color: var(--ds-c-chalk-board-boundary-67); color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th {
    text-align: right; font-size: var(--ds-c-chalk-board-type-4); font-weight: var(--ds-c-chalk-board-typography-8); color: var(--muted);
    padding: 0 var(--ds-c-chalk-board-space-15) var(--ds-c-chalk-board-space-15); text-transform: uppercase; letter-spacing: var(--ds-c-chalk-board-size-100); white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; }
  th.seat, td.seat { text-align: left; }
  td { padding: var(--ds-c-chalk-board-space-24) var(--ds-c-chalk-board-space-15); border-top: var(--ds-c-chalk-board-size-3) solid var(--line); font-size: var(--ds-c-chalk-board-type-9); text-align: right; white-space: nowrap; }
  tr.alert td { background: var(--ds-c-chalk-board-surface-93); }
  tr.watch td { background: var(--ds-c-chalk-board-surface-94); }
  .idle { font-size: var(--ds-c-chalk-board-type-14); font-weight: var(--ds-c-chalk-board-typography-17); }
  .idle.alert { color: var(--alert); }
  .idle.watch { color: var(--watch); }
  .idle.ok { color: var(--ok); }
  .seat b { font-size: var(--ds-c-chalk-board-type-17); }
  .state {
    display: inline-block; font-size: var(--ds-c-chalk-board-type-4); padding: var(--ds-c-chalk-board-space-14) var(--ds-c-chalk-board-space-12); border-radius: var(--ds-c-chalk-board-radius-13);
    text-transform: uppercase; letter-spacing: var(--ds-c-chalk-board-size-103); font-weight: var(--ds-c-chalk-board-typography-17);
  }
  .state.alert { background: var(--ds-c-chalk-board-surface-95); color: var(--ds-c-chalk-board-ink-79); }
  .state.watch { background: var(--ds-c-chalk-board-surface-96); color: var(--ds-c-chalk-board-ink-80); }
  .state.ok { background: var(--ds-c-chalk-board-surface-97); color: var(--ds-c-chalk-board-ink-81); }
  .u { color: var(--unknown); }
  .foot { color: var(--muted); font-size: var(--ds-c-chalk-board-type-3); margin-top: var(--ds-c-chalk-board-space-19); }
  .scroll { overflow-x: auto; }
  @media (max-width: 520px) { .hide-s { display: none; } }
/* BOARD_STATUS_CSS */
</style>
</head>
<body>
<div class="wrap">
  <h1>강사 라이브 보드</h1>
  <div class="sub">모든 좌석이 항상 한 줄씩. 조용한 좌석이 먼저 보입니다. 10초마다 갱신.</div>

  <fieldset id="setup">
    <legend>① 강사 issuer 토큰 · cohort</legend>
    <textarea id="issuer" rows="3" placeholder="eyJjIgi… (강사 토큰)"></textarea>
    <label for="cohort">cohort id</label>
    <input id="cohort" placeholder="kids-workshop-2026-a" autocapitalize="off" spellcheck="false">
    <label for="prefix">좌석 prefix (비우면 <em>접속한 좌석만</em> 보입니다)</label>
    <input id="prefix" placeholder="KW34-CM6YPX-" autocapitalize="off" spellcheck="false">
    <button id="go">보드 열기 →</button>
    <button class="ghost" id="forget" type="button">토큰 지우기</button>
  </fieldset>

  <div id="banners"></div>
  <div id="summary" class="cgp-filters"></div>
  <div class="scroll"><table id="tbl"></table></div>
  <div class="foot" id="foot"></div>
</div>

<script>
// BOARD_STATUS_SCRIPT

const $ = (id) => document.getElementById(id);
const POLL_MS = 10000;   // §4: polling. No SSE, no Durable Objects.

// Paste normalization — same rule as /console and /issuer (issue #65).
function sanitizeToken(raw) {
  if (typeof raw !== "string") return "";
  let s = raw.replace(/\s+/g, "").replace(/[​-‍﻿⁠]/g, "");
  for (let i = 0; i < 8; i++) {
    const before = s;
    s = s.replace(/^["'`,\[\]\{\}\s]+/, "").replace(/["'`,\[\]\{\}\s]+$/, "");
    if (s === before) break;
  }
  return s;
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Two-second readability: an idle time is a shape, not a number to parse.
function dur(ms) {
  if (ms === null || ms === undefined) return null;
  const s = Math.round(ms / 1000);
  if (s < 60) return s + "초";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "분";
  return Math.floor(m / 60) + "시간 " + (m % 60) + "분";
}
const unk = '<span class="u">—</span>';

const KEY = "hps_issuer_token";
const CKEY = "hps_board_cohort";
const PKEY = "hps_board_prefix";
(function () {
  const m = /[#&]t=([^&]+)/.exec(location.hash || "");
  if (m) { $("issuer").value = sanitizeToken(decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname + location.search); }
  const q = new URLSearchParams(location.search);
  if (!$("issuer").value && sessionStorage.getItem(KEY)) $("issuer").value = sessionStorage.getItem(KEY);
  $("cohort").value = q.get("cohort") || sessionStorage.getItem(CKEY) || "";
  $("prefix").value = q.get("seat_prefix") || sessionStorage.getItem(PKEY) || "";
})();
$("forget").onclick = () => {
  sessionStorage.removeItem(KEY); $("issuer").value = "";
  stop(); $("banners").innerHTML = $("summary").innerHTML = $("tbl").innerHTML = $("foot").innerHTML = "";
};

let timer = null, readGeneration = 0;
function stop() {
  readGeneration++;
  statusBoard=null;statusFilter="all";$("summary").replaceChildren();$("tbl").replaceChildren(); if (timer) { clearInterval(timer); timer = null; } }

function mapServerError(raw) {
  const e = String(raw || "").toLowerCase();
  if (e.includes("expired")) return "issuer 토큰이 만료됐어요. 재발급 받아주세요.";
  if (e.includes("revoked")) return "이 토큰은 무효화됐어요.";
  if (e.includes("not an issuer")) return "학생 토큰이 붙여넣어졌어요. 강사(issuer) 토큰이 필요해요.";
  if (e.includes("not scoped")) return "이 토큰의 권한 범위 밖 cohort예요.";
  if (e.includes("invalid signature") || e.includes("malformed")) return "토큰이 손상됐어요. 공백·따옴표 없이 다시 붙여넣어 주세요.";
  return "오류: " + raw;
}

async function load() {
  const generation=++readGeneration;
  const token = sanitizeToken($("issuer").value);
  const cohort = $("cohort").value.trim();
  const prefix = $("prefix").value.trim();
  const current=()=>generation===readGeneration && token===sanitizeToken($("issuer").value) && cohort===$("cohort").value.trim() && prefix===$("prefix").value.trim();
  if (!token || !cohort) { stop(); $("banners").innerHTML = '<div class="banner err">토큰과 cohort id를 채워주세요.</div>'; return; }
  sessionStorage.setItem(KEY, token);
  sessionStorage.setItem(CKEY, cohort);
  sessionStorage.setItem(PKEY, prefix);

  let url = "/admin/cohorts/" + encodeURIComponent(cohort) + "/board";
  if (prefix) url += "?seat_prefix=" + encodeURIComponent(prefix);
  let body;
  try {
    const res = await fetch(url, { headers: { authorization: "Bearer " + token } });
    body = await res.json();
    if (!current()) return;
    if (!res.ok) {
      stop();
      $("banners").innerHTML = '<div class="banner err">' + esc(mapServerError(body && (body.error && body.error.message || body.error))) + "</div>";
      return;
    }
  } catch (e) {
    if (!current()) return;
    statusBoard=null;statusFilter="all";$("summary").replaceChildren();$("tbl").replaceChildren();
    $("banners").innerHTML = '<div class="banner err">보드를 불러오지 못했어요 (네트워크). 다시 시도 중…</div>';
    return;
  }
  render(body);
}

let statusFilter="all", statusBoard=null;
function render(b) {
  statusBoard=b;
  // Announce every lost capability. No silent fallback — a column that quietly
  // reads "fine" because the data isn't there is the exact defect this plan
  // spent seven tasks removing (spec §5, REQ-M30).
  $("banners").innerHTML = (b.degraded || [])
    .map((d) => '<div class="banner warn"><b>' + esc(d.column) + "</b> — " + esc(d.reason) + "</div>")
    .join("");

  const seats = b.seats || [];
  boardStatus.filters($("summary"),seats.map(boardStatus.legacy),statusFilter,key=>{if(!statusBoard)return;statusFilter=key;render(statusBoard);});
  const errUnknown = b.error_signal !== "observed";
  const head =
    "<tr><th class='seat'>좌석</th><th>마지막 턴</th><th>상태</th>" +
    "<th class='hide-s'>평균 대기</th><th class='hide-s'>호출 15분</th>" +
    "<th class='hide-s'>오류</th><th class='hide-s'>하트비트</th><th class='hide-s'>산출물</th></tr>";

  const rows = seats.filter(s=>statusFilter==="all"||boardStatus.legacy(s)===statusFilter).map((s) => {
    const idle = dur(s.idle_ms);
    return (
      '<tr class="' + esc(s.severity) + '">' +
      '<td class="seat"><b>' + esc(s.user_id) + "</b></td>" +
      '<td><span class="idle ' + esc(s.severity) + '">' + (idle === null ? "없음" : esc(idle)) + "</span></td>" +
      '<td>' + boardStatus.chip(boardStatus.legacy(s)).outerHTML + '</td>' +
      "<td class='hide-s'>" + (s.mean_wait_ms === null ? unk : esc(dur(s.mean_wait_ms))) + "</td>" +
      "<td class='hide-s'>" + s.calls_in_window + "</td>" +
      "<td class='hide-s'>" + (errUnknown || s.failures_in_window === null ? unk : s.failures_in_window) + "</td>" +
      "<td class='hide-s'>" + (s.heartbeat === "unknown" ? unk : esc(s.heartbeat)) + "</td>" +
      "<td class='hide-s'>" + (s.artifact_age_ms === null ? unk : esc(dur(s.artifact_age_ms))) + "</td>" +
      "</tr>"
    );
  });
  $("tbl").innerHTML = head + rows.join("") + (rows.length?"":"<tr><td colspan=8>조건에 맞는 학생이 없습니다. 전체를 눌러 보세요.</td></tr>");

  const th = b.thresholds || {};
  $("foot").innerHTML =
    "기준 · 조용함 ≥ " + Math.round((th.quietIdleMs || 0) / 60000) + "분 · 느려짐 ≥ " +
    Math.round((th.slowingIdleMs || 0) / 60000) + "분 · 막힘 = 15분 평균 대기 ≥ " +
    Math.round((th.stuckMeanWaitMs || 0) / 60000) + "분. " +
    "명단 " + esc(b.roster && b.roster.source) + (b.roster && b.roster.complete ? " (전체)" : " (접속 좌석만)") +
    " · 서버시각 " + esc(b.now) + " · <span class='u'>—</span> 는 <b>모름</b>이지 <b>이상 없음</b>이 아닙니다.";
}

$("go").onclick = () => { stop(); load(); timer = setInterval(load, POLL_MS); };
if ($("issuer").value && $("cohort").value) $("go").click();
</script>
</body>
</html>
