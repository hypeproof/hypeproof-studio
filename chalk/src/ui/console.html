</style><div class="hp-flowbar"><a class="hp-home" href="/manage">HypeProof Chalk · 강사</a><nav aria-label="강사 도구"><a href="/manage">수업 운영</a><a href="/authoring">강의 작성</a><a href="/issuer">학생 초대</a><a href="/console" aria-current="page">수업 시작·종료</a><a href="/budgets">AI 예산</a><details><summary>더보기</summary><div class="more-links"><a href="/authoring#rehearsal">리허설·확정</a><a href="/manage#ops-help-title">도움 요청</a><a href="/manage#shares-title">공유 기록</a><a href="/manage#ops-finish-title">기록 회수·보고서</a></div></details></nav></div>
<div class="wrap">
  <h1>수업 열기·종료</h1>
  <p><a href="/start">처음 강의를 준비한다면</a></p>
  <div class="sub">강사 연결 후 담당 수업을 선택하세요.</div>

  <fieldset>
    <legend>강사 연결</legend>
    <!--@chalk-connect-->
    <button id="load" type="button">담당 수업 불러오기</button>
  </fieldset>

  <div id="tokenBanner"></div>
  <div id="cohorts"></div>
  <div id="minter"></div>
</div>

<script>
/*@roster-csv*/
// The inlined script binds rosterCsvKit to the kit object (the factory already ran).
const rosterCsv = rosterCsvKit;
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function mapServerError(raw) {
  const e = String(raw || "").toLowerCase();
  // Chalk's own connection refusals are already Korean and actionable.
  if (/연결/.test(e)) return String(raw);
  if (e.includes("expired")) return "강사 연결이 만료됐어요. 위의 ‘다시 연결’을 눌러주세요.";
  if (e.includes("revoked")) return "이 강사 연결은 무효화됐어요. ‘다시 연결’을 눌러주세요.";
  if (e.includes("not an issuer")) return "강사 권한이 아닌 연결이에요. ‘다시 연결’을 눌러주세요.";
  if (e.includes("can_start_session")) return "이 연결에는 세션 시작 권한이 없어요. 운영진에게 알려주세요.";
  if (e.includes("not scoped")) return "연결할 때 이 수업을 고르지 않았어요. ‘다시 연결’에서 이 수업을 골라주세요.";
  if (e.includes("invalid signature") || e.includes("malformed")) return "강사 연결 정보를 확인하지 못했어요. ‘다시 연결’을 눌러주세요.";
  if (e.includes("exceeds") && e.includes("max")) return "본인 권한의 최대 시간을 초과했어요. 시간을 줄여주세요.";
  return "오류: " + raw;
}

// Clearing the Lab connection clears what was loaded with it.
globalThis.chalkConnection?.onChange((c) => {
  if (!c.connected) $("tokenBanner").innerHTML = $("cohorts").innerHTML = $("minter").innerHTML = "";
});

let countdownTimer = null;
let distributionTargets = [];

// No Authorization header: Chalk takes the issuer from the Lab login session.
async function api(path, opts) {
  const res = await fetch(path, {
    ...opts,
    headers: { "content-type": "application/json", ...(opts && opts.headers) },
  });
  const body = await res.json().catch(() => ({}));
  // Chalk's own upstream errors are objects ({type, message}); show the message, not [object Object].
  const e = body.error;
  if (!res.ok) throw new Error((typeof e === "string" ? e : e && e.message) || ("HTTP " + res.status));
  return body;
}

$("load").onclick = load;
async function load() {
  const banner = $("tokenBanner");
  banner.innerHTML = ""; $("cohorts").innerHTML = ""; $("minter").innerHTML = "";
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

  // The connection status carries what the page used to decode from a pasted token:
  // the handle, the expiry and the scope list. The Service still checks every call.
  const conn = await (globalThis.chalkConnection?.refresh() ?? { connected: false });
  if (!conn.connected) {
    return (banner.innerHTML = '<div class="banner err">' + (conn.expired
      ? '강사 연결이 만료됐어요. 위의 ‘다시 연결’을 눌러주세요.'
      : '위의 ‘Lab 로그인으로 연결’을 눌러 강사 권한을 먼저 연결해주세요.') + '</div>');
  }
  const payload = { u: conn.member && conn.member.name, exp: Math.floor(Date.parse(conn.expires_at) / 1000), scopes: conn.scopes };

  // Expiry banner — surfaces the "stale connection" failure the moment the page
  // opens, not as a 403 mid-lecture.
  const expMs = (payload.exp || 0) * 1000;
  const soon = expMs - Date.now() < 2 * 3600000;
  banner.innerHTML = '<div class="banner ' + (soon ? "warn" : "ok") + '">' +
    esc(payload.u || "강사") + ' · 연결 유효: ' + esc(new Date(expMs).toLocaleString()) + '까지' +
    (soon ? ' — <b>곧 만료됩니다.</b> 수업 전에 ‘다시 연결’을 눌러두세요.' : '') + '</div>';

  distributionTargets = [];
  try {
    const routing = await api('/workshop/boa-tokens', { method: 'GET' });
    if (!Array.isArray(routing.targets) || routing.targets.some((target) =>
      !target || typeof target.cohort !== 'string' || !Array.isArray(target.profiles) ||
      target.profiles.some((id) => typeof id !== 'string'))) throw new Error('배부 설정 형식이 올바르지 않습니다.');
    distributionTargets = routing.targets;
  } catch {
    banner.innerHTML += '<div class="banner warn">공개 배부 보드 설정을 확인하지 못했습니다. 이번 발급 결과는 보드에 자동 게시되지 않으므로 학생에게 직접 전달하세요.</div>';
  }
  for (const scope of payload.scopes || []) renderCohort(scope);
}

async function renderCohort(scope) {
  const wrap = document.createElement("fieldset");
  wrap.innerHTML = '<legend>② 세션 — ' + esc(scope.cohort) + '</legend><div class="help">불러오는 중…</div>';
  $("cohorts").appendChild(wrap);

  let state;
  try {
    state = await api("/admin/cohorts/" + encodeURIComponent(scope.cohort) + "/state", { method: "GET" });
  } catch (err) {
    wrap.innerHTML = '<legend>② 세션 — ' + esc(scope.cohort) + '</legend>' +
      '<div class="banner err">' + esc(mapServerError(err.message)) +
      '<div class="err-detail">원본 오류: ' + esc(err.message) + '</div></div>';
    return;
  }

  const canStart = state.scope ? state.scope.can_start_session : false;
  const maxH = state.scope ? state.scope.max_session_hours : 4;
  let html = '<legend>② 세션 — ' + esc(scope.cohort) + '</legend>';
  if (state.paused) html += '<div class="banner warn">⚠ 이 cohort는 일시정지(pause) 상태예요 — 세션을 열어도 학생 채팅이 차단됩니다. Jay 확인 필요.</div>';
  if (!canStart) html += '<div class="banner warn">이 강사 연결엔 세션 시작 권한이 없어요 (조회·토큰 발급만 가능). 운영진에게 알려주세요.</div>';

  const live = state.session && Date.parse(state.session.ends_at) > Date.now();
  for (const p of state.profiles) {
    const isLive = live && state.session.profile_id === p.id;
    html += '<div class="track' + (isLive ? " live" : "") + '" id="trk-' + esc(p.id) + '">' +
      '<h3>' + esc(p.display_name) + (isLive ? ' — <span style="color:var(--ok)">진행 중</span>' : '') + '</h3>' +
      '<div class="pid">' + esc(p.id) + '</div>' +
      (isLive
        ? '<div class="countdown" data-ends="' + esc(state.session.ends_at) + '"></div>' +
          '<button class="danger" data-close="' + esc(scope.cohort) + '">세션 닫기</button>'
        : (canStart
          ? '<div class="row session-start"><div class="session-duration"><label>시간<select data-hours>' +
            [1,2,3,4,5,6].filter(h => h <= maxH).map(h =>
              '<option value="' + h + '"' + (h === Math.min(4, maxH) ? " selected" : "") + '>' + h + '시간</option>').join("") +
            '</select></label></div>' +
            '<button data-open="' + esc(scope.cohort) + '" data-profile="' + esc(p.id) + '">이 트랙으로 세션 열기</button></div>'
          : "")) +
      '</div>';
  }
  if (live && !state.profiles.some((p) => p.id === state.session.profile_id)) {
    html += '<div class="banner warn">지금 열려 있는 세션(' + esc(state.session.profile_id) + ')은 이 토큰의 트랙 범위 밖이에요.</div>';
  }
  html += '<div class="help">참가자 ' + state.roster_size + '명 등록됨 · 한 cohort에 세션은 동시에 1개 — 다른 트랙을 열면 기존 세션이 닫혀요.</div>';
  html += freezeSection(scope.cohort, state.update_freeze, canStart);
  wrap.innerHTML = html;
  setLegendBadge(wrap, scope.cohort, state.update_freeze);
  wireFreeze(wrap, scope.cohort, state.update_freeze);

  wrap.querySelectorAll("[data-open]").forEach((btn) => {
    btn.onclick = async () => {
      const hours = parseInt(btn.closest(".row").querySelector("[data-hours]").value, 10);
      btn.disabled = true; btn.textContent = "여는 중…";
      try {
        const now = new Date();
        await api("/admin/cohorts/" + encodeURIComponent(btn.dataset.open) + "/session", {
          method: "POST",
          body: JSON.stringify({
            profile_id: btn.dataset.profile,
            starts_at: now.toISOString(),
            ends_at: new Date(now.getTime() + hours * 3600000).toISOString(),
          }),
        });
        load();
      } catch (err) {
        btn.disabled = false; btn.textContent = "이 트랙으로 세션 열기";
        alert(mapServerError(err.message));
      }
    };
  });
  wrap.querySelectorAll("[data-close]").forEach((btn) => {
    btn.onclick = async () => {
      if (!confirm("지금 세션을 닫을까요? 학생들의 코치 대화가 즉시 중단됩니다.")) return;
      btn.disabled = true;
      try { await api("/admin/cohorts/" + encodeURIComponent(btn.dataset.close) + "/session", { method: "DELETE" }); load(); }
      catch (err) { btn.disabled = false; alert(mapServerError(err.message)); }
    };
  });

  startCountdowns();
  renderRosterImport(scope);
  renderMinter(scope, state);
  renderLabTokens(scope);
}

// ---- CGP-SHELL-R-003 / CGP-SHELL-D-002 — the cohort's Studio update freeze ----------------------------------------
// The Service stores one range per cohort (PUT/DELETE /admin/cohorts/:id/update-freeze, can_start_session) and serves it
// to the cohort's classroom seats; Studio hides the update banner inside it unless the release is security-critical.
// Dates are Korea calendar days. The state read already carries update_freeze (null when missing or ended).
const LOCK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const SHIELD_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>';
const FREEZE_MAX_DAYS = 60;
const kstToday = (offsetDays = 0) => new Date(Date.now() + 9 * 3600000 + offsetDays * 86400000).toISOString().slice(0, 10);
const md = (day) => { const [, m, d] = String(day).split('-').map(Number); return m + '/' + d; };
const koDay = (day) => { const [, m, d] = String(day).split('-').map(Number); return m + '월 ' + d + '일'; };
const dayCount = (from, until) => Math.round((Date.parse(until + 'T00:00:00Z') - Date.parse(from + 'T00:00:00Z')) / 86400000) + 1;
const freezeStarted = (f) => !!f && Date.parse(f.starts_at) <= Date.now();
/** Badge words: "업데이트 고정 ~10/31" while it runs, "업데이트 고정 예정 11/20~11/30" before it starts. */
function freezeBadgeText(f) {
  return freezeStarted(f) ? '업데이트 고정 ~' + md(f.until) : '업데이트 고정 예정 ' + md(f.from) + '~' + md(f.until);
}
function freezeRangeText(from, until) {
  if (!from || !until) return '시작일과 마지막 날을 고르세요.';
  const n = dayCount(from, until);
  if (!(n >= 1)) return '마지막 날이 시작일보다 앞이에요.';
  return '고정 기간: ' + koDay(from) + '부터 ' + koDay(until) + '까지 (' + n + '일)' + (n > FREEZE_MAX_DAYS ? ' — 최대 ' + FREEZE_MAX_DAYS + '일까지 고정할 수 있어요.' : '');
}
function setLegendBadge(wrap, cohort, f) {
  const legend = wrap.querySelector('legend');
  if (!legend) return;
  legend.textContent = '② 세션 — ' + cohort;
  if (!f) return;
  const badge = document.createElement('span');
  badge.className = 'freeze-badge';
  badge.dataset.freezeBadge = cohort;
  badge.innerHTML = LOCK_SVG + '<span>' + esc(freezeBadgeText(f)) + '</span>';
  legend.appendChild(badge);
}
function freezeSection(cohort, f, canStart) {
  const id = 'fz-' + cohort.replace(/[^A-Za-z0-9_-]/g, '_');
  const from = f ? f.from : kstToday(0);
  const until = f ? f.until : '';
  let html = '<div class="freeze" role="group" aria-labelledby="' + id + '-title" data-freeze="' + esc(cohort) + '">' +
    '<h3 id="' + id + '-title">Studio 업데이트 고정</h3>' +
    '<p>정한 기간에는 이 수업 학생들의 Studio에 업데이트 안내가 뜨지 않아요. 날짜는 한국 시간 기준이고, 최대 ' + FREEZE_MAX_DAYS + '일까지예요. 보안 업데이트는 고정과 상관없이 안내돼요.</p>' +
    '<p class="freeze-security" data-freeze-security hidden></p>';
  if (f) html += '<p class="freeze-now" data-freeze-now>' + (freezeStarted(f) ? '지금 고정 중: ' : '고정 예정: ') + esc(koDay(f.from)) + '부터 ' + esc(koDay(f.until)) + '까지' + (f.set_by ? ' · ' + esc(f.set_by) + ' 선생님이 정함' : '') + '</p>';
  if (!canStart) return html + '<p>이 강사 연결엔 세션 시작 권한이 없어서 고정을 바꿀 수 없어요.</p></div>';
  html += '<div class="freeze-dates">' +
      '<div><label for="' + id + '-from">시작일</label><input type="date" id="' + id + '-from" data-freeze-from value="' + esc(from) + '" min="' + esc(f && f.from < kstToday(0) ? f.from : kstToday(0)) + '" aria-describedby="' + id + '-range"></div>' +
      '<div><label for="' + id + '-until">마지막 날</label><input type="date" id="' + id + '-until" data-freeze-until value="' + esc(until) + '" min="' + esc(kstToday(0)) + '" aria-describedby="' + id + '-range"></div>' +
    '</div>' +
    '<p class="freeze-range" id="' + id + '-range" data-freeze-range aria-live="polite">' + esc(freezeRangeText(from, until)) + '</p>' +
    '<div class="freeze-actions"><button type="button" data-freeze-save>' + (f ? '고정 기간 바꾸기' : '업데이트 고정하기') + '</button>' +
    (f ? '<button type="button" class="ghost" data-freeze-clear>고정 풀기</button>' : '') + '</div>' +
    '<p class="freeze-msg" data-freeze-msg role="status"></p>';
  return html + '</div>';
}
const FREEZE_REASONS = {
  freeze_invalid_date: '날짜를 확인해 주세요.',
  freeze_range_reversed: '마지막 날이 시작일보다 앞이에요.',
  freeze_range_past: '마지막 날이 이미 지났어요. 오늘이나 그 뒤로 골라 주세요.',
  freeze_range_too_long: '최대 ' + FREEZE_MAX_DAYS + '일까지 고정할 수 있어요.',
};
async function freezeRequest(cohort, method, body) {
  const res = await fetch('/admin/cohorts/' + encodeURIComponent(cohort) + '/update-freeze', {
    method, headers: { 'content-type': 'application/json' }, ...(body ? { body: JSON.stringify(body) } : {}),
  });
  const data = await res.json().catch(() => ({}));
  if (res.ok) return data;
  const e = data.error;
  throw new Error(FREEZE_REASONS[data.reason] || mapServerError((typeof e === 'string' ? e : e && e.message) || ('HTTP ' + res.status)));
}
let latestReleaseRead = null;
async function showSecurityLabel(box) {
  const line = box.querySelector('[data-freeze-security]');
  if (!line) return;
  latestReleaseRead ??= fetch('/studio/latest-release').then(r => r.ok ? r.json() : null).catch(() => null);
  const latest = await latestReleaseRead;
  if (!latest || latest.security_critical !== true || typeof latest.version !== 'string') return;
  line.innerHTML = SHIELD_SVG + '<span>최신 Studio v' + esc(latest.version) + '는 보안 업데이트예요. 업데이트 고정 중에도 학생에게 안내돼요.</span>';
  line.hidden = false;
}
function wireFreeze(wrap, cohort, f) {
  const box = wrap.querySelector('[data-freeze]');
  if (!box) return;
  // The latest release is read only while a freeze exists: that is when its security label changes what students see.
  if (f) void showSecurityLabel(box);
  const from = box.querySelector('[data-freeze-from]'), until = box.querySelector('[data-freeze-until]');
  const range = box.querySelector('[data-freeze-range]'), msg = box.querySelector('[data-freeze-msg]');
  if (!from || !until) return;
  const update = () => { range.textContent = freezeRangeText(from.value, until.value); };
  from.addEventListener('input', update); until.addEventListener('input', update);
  from.addEventListener('change', update); until.addEventListener('change', update);
  const busy = (on) => box.querySelectorAll('button').forEach(b => { b.disabled = on; });
  const done = async (text) => {
    const state = await api('/admin/cohorts/' + encodeURIComponent(cohort) + '/state', { method: 'GET' }).catch(() => null);
    const next = state ? state.update_freeze : null;
    const fresh = document.createElement('div');
    fresh.innerHTML = freezeSection(cohort, next, true);
    box.replaceWith(fresh.firstChild);
    setLegendBadge(wrap, cohort, next);
    wireFreeze(wrap, cohort, next);
    const m = wrap.querySelector('[data-freeze-msg]');
    if (m) m.textContent = text;
  };
  box.querySelector('[data-freeze-save]').onclick = async () => {
    msg.className = 'freeze-msg'; msg.textContent = '';
    const n = dayCount(from.value, until.value);
    if (!from.value || !until.value) { msg.className = 'freeze-msg err'; msg.textContent = '시작일과 마지막 날을 모두 고르세요.'; return; }
    if (!(n >= 1)) { msg.className = 'freeze-msg err'; msg.textContent = FREEZE_REASONS.freeze_range_reversed; return; }
    if (n > FREEZE_MAX_DAYS) { msg.className = 'freeze-msg err'; msg.textContent = FREEZE_REASONS.freeze_range_too_long; return; }
    busy(true);
    try {
      const saved = await freezeRequest(cohort, 'PUT', { from: from.value, until: until.value });
      const v = saved.update_freeze;
      await done('저장했어요. ' + koDay(v.from) + '부터 ' + koDay(v.until) + '까지 이 수업 학생들의 Studio 업데이트를 고정해요. 학생 화면에는 1분쯤 뒤에 반영돼요.');
    } catch (err) { busy(false); msg.className = 'freeze-msg err'; msg.textContent = err.message; }
  };
  const clear = box.querySelector('[data-freeze-clear]');
  if (clear) clear.onclick = async () => {
    busy(true);
    try { await freezeRequest(cohort, 'DELETE'); await done('고정을 풀었어요. 학생 Studio에 업데이트 안내가 다시 뜰 수 있어요.'); }
    catch (err) { busy(false); msg.className = 'freeze-msg err'; msg.textContent = err.message; }
  };
}

function startCountdowns() {
  if (countdownTimer) clearInterval(countdownTimer);
  const tick = () => {
    document.querySelectorAll(".countdown[data-ends]").forEach((el) => {
      const left = Date.parse(el.dataset.ends) - Date.now();
      if (left <= 0) { el.textContent = "종료됨 — 새로고침하세요"; return; }
      const h = Math.floor(left / 3600000), m = Math.floor((left % 3600000) / 60000), s = Math.floor((left % 60000) / 1000);
      el.textContent = "종료까지 " + h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") +
        " (" + new Date(Date.parse(el.dataset.ends)).toLocaleTimeString() + " 종료)";
    });
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function renderMinter(scope, state) {
  if (document.getElementById("mint-" + scope.cohort)) return;
  const maxTokH = state.scope ? state.scope.max_hours : 12;
  const wrap = document.createElement("fieldset");
  wrap.id = "mint-" + scope.cohort;
  wrap.innerHTML =
    '<legend>③ 학생 토큰 일괄 발급 — ' + esc(scope.cohort) + '</legend>' +
    '<label>트랙</label><select id="mp-' + esc(scope.cohort) + '">' +
    state.profiles.map((p) => '<option value="' + esc(p.id) + '">' + esc(p.display_name) + '</option>').join("") +
    '</select>' +
    '<label>참가자 handle 목록 (한 줄에 한 명 — 소문자·영숫자·하이픈). 발급하면 명단에도 자동 등록돼요.</label>' +
    '<textarea id="mu-' + esc(scope.cohort) + '" rows="4" placeholder="kim-cheolsu&#10;lee-younghee"></textarea>' +
    '<label>유효시간 (최대 ' + maxTokH + 'h)</label>' +
    '<input id="mh-' + esc(scope.cohort) + '" type="number" min="1" max="' + maxTokH + '" value="' + Math.min(12, maxTokH) + '">' +
    '<button id="mb-' + esc(scope.cohort) + '">일괄 발급 →</button>' +
    '<div id="mr-' + esc(scope.cohort) + '"></div>';
  $("minter").appendChild(wrap);

  $("mb-" + scope.cohort).onclick = async () => {
    const btn = $("mb-" + scope.cohort);
    const out = $("mr-" + scope.cohort);
    const p = $("mp-" + scope.cohort).value;
    const hours = parseInt($("mh-" + scope.cohort).value, 10);
    const users = $("mu-" + scope.cohort).value.split("\n").map((s) => s.trim()).filter(Boolean);
    out.innerHTML = "";
    if (!users.length) return (out.innerHTML = '<div class="banner err">참가자 handle을 한 줄에 한 명씩 입력해주세요.</div>');
    btn.disabled = true;
    const publishesToBoa = distributionTargets.some((target) => target.cohort === scope.cohort && target.profiles.includes(p));
    let results = [];
    let boardNotice = "";
    if (publishesToBoa) {
      try {
        btn.textContent = "발급·배부 보드 등록 중…";
        const body = await api("/workshop/boa-tokens", {
          method: "POST", body: JSON.stringify({ cohort: scope.cohort, profile: p, users, hours }),
        });
        results = body.results.map((r) => ({ u: r.handle, token: r.token, error: r.error }));
        boardNotice = body.board
          ? '<div class="banner ok">학생 토큰을 <a href="https://hypeproof-ai.xyz/live/boa#token" target="_blank" rel="noopener noreferrer">내 토큰 받기</a>에 올렸습니다.</div>'
          : body.boardError ? '<div class="banner err">' + esc(body.boardError) + '</div>' : "";
      } catch (err) {
        btn.disabled = false; btn.textContent = "일괄 발급 →";
        return (out.innerHTML = '<div class="banner err">' + esc(mapServerError(err.message)) + '</div>');
      }
    } else {
      // Other cohorts retain their existing Service-only issuance path.
      try {
        btn.textContent = "명단 등록 중…";
        await api("/admin/cohorts/" + encodeURIComponent(scope.cohort) + "/roster/append", {
          method: "POST", body: JSON.stringify({ users }),
        });
      } catch (err) {
        btn.disabled = false; btn.textContent = "일괄 발급 →";
        return (out.innerHTML = '<div class="banner err">참가자 명단 등록 실패 — 발급을 중단했어요. ' + esc(mapServerError(err.message)) + '</div>');
      }
      for (const u of users) {
        btn.textContent = "발급 중… (" + (results.length + 1) + "/" + users.length + ")";
        try {
          const body = await api("/admin/tokens/issue", { method: "POST", body: JSON.stringify({ u, c: scope.cohort, p, hours }) });
          results.push({ u, token: body.token });
        } catch (err) {
          results.push({ u, error: err.message });
        }
      }
    }
    btn.disabled = false; btn.textContent = "일괄 발급 →";
    // Two copy affordances, because they serve two different destinations and
    // mixing them up is a lecture-day trap (#427): the per-line button copies
    // the RAW token (goes straight into the Studio token box), the bulk button
    // copies "이름: 토큰" pairs (goes into KakaoTalk so each student can find
    // their own line). Pasting the bulk format into the app yields a 401 —
    // hence the explicit warning on the bulk label.
    out.innerHTML = boardNotice +
      results.map((r, i) => '<div class="tok-line"><div class="name">' + esc(r.u) + (r.error ? ' — <span style="color:var(--warn)">' + esc(mapServerError(r.error)) + '</span>' : "") + '</div>' +
        (r.token
          ? '<div class="token">' + esc(r.token) + '</div>' +
            '<button class="tok-copy" data-idx="' + i + '">이 토큰만 복사</button>'
          : "") + '</div>').join("") +
      (results.some((r) => r.token)
        ? '<button class="ghost" id="copyall-' + esc(scope.cohort) + '">명단용 전체 복사 (이름: 토큰 — 앱에 그대로 붙이면 안 됩니다)</button>'
        : "");
    out.querySelectorAll(".tok-copy").forEach((b) => {
      b.onclick = () => window.chalkCopyFeedback(b, () => results[Number(b.dataset.idx)].token);
    });
    const copyBtn = document.getElementById("copyall-" + scope.cohort);
    if (copyBtn) copyBtn.onclick = () => window.chalkCopyFeedback(copyBtn, () => results.filter((r) => r.token).map((r) => r.u + ": " + r.token).join("\n\n"));
  };
}

// CGP-SHELL-R-032 / D-031 — roster CSV import (classroom-admin ADM-01 roster CSV). Paste or upload → preview table →
// the instructor confirms → the valid handles go to the Service's existing roster append (handles only, like ③) →
// one result line per row. "실패한 줄만 다시" resends only the failed rows. No token is issued here.
function renderRosterImport(scope) {
  const id = "ri-" + scope.cohort.replace(/[^A-Za-z0-9_-]/g, "_");
  if (document.getElementById(id)) return;
  const wrap = document.createElement("fieldset");
  wrap.id = id; wrap.className = "roster-import";
  wrap.innerHTML =
    '<legend>명단 가져오기 (CSV) — ' + esc(scope.cohort) + '</legend>' +
    '<div class="help" id="' + id + '-help">첫 줄은 머리글 <code>handle,name</code>이에요. 이 가져오기는 handle(영문 소문자·숫자·하이픈)만 서버로 보내요. handle은 서버에 남으니 실명·전화번호 대신 <code>s01</code>처럼 번호로 정해 주세요. name 열은 이 화면에서 줄을 맞춰 볼 때만 써요. 한 번에 ' + rosterCsv.MAX_ROWS + '줄까지 받아요. 학생 토큰은 아래 ③에서 따로 발급해요.</div>' +
    '<label for="' + id + '-file">CSV 파일 고르기</label>' +
    '<input id="' + id + '-file" type="file" accept=".csv,text/csv,text/plain" aria-describedby="' + id + '-help">' +
    '<label for="' + id + '-text">또는 붙여넣기</label>' +
    '<textarea id="' + id + '-text" rows="5" spellcheck="false" aria-describedby="' + id + '-help" placeholder="handle,name&#10;s01,김민지&#10;s02,이서준"></textarea>' +
    '<button type="button" data-ri-preview>미리 보기</button>' +
    '<div data-ri-error role="alert"></div>' +
    '<div data-ri-preview-area hidden>' +
      '<h3 id="' + id + '-sum" tabindex="-1" data-ri-summary></h3>' +
      '<div class="ri-table-wrap" tabindex="0" role="region" aria-labelledby="' + id + '-sum" data-ri-table></div>' +
      '<label class="ri-confirm"><input type="checkbox" data-ri-confirm> <span data-ri-confirm-text></span></label>' +
      '<button type="button" data-ri-send disabled></button>' +
    '</div>' +
    '<div data-ri-results-area hidden>' +
      '<h3 id="' + id + '-res" tabindex="-1">보낸 결과</h3>' +
      '<p class="ri-count" role="status" data-ri-count></p>' +
      '<ol class="ri-results" aria-labelledby="' + id + '-res" data-ri-results></ol>' +
      '<button type="button" class="ghost" data-ri-retry hidden>실패한 줄만 다시</button>' +
    '</div>';
  $("minter").appendChild(wrap);

  const q = (sel) => wrap.querySelector(sel);
  const fileInput = $(id + "-file"), text = $(id + "-text");
  const previewBtn = q("[data-ri-preview]"), errorBox = q("[data-ri-error]");
  const area = q("[data-ri-preview-area]"), summary = q("[data-ri-summary]"), tableBox = q("[data-ri-table]");
  const confirmBox = q("[data-ri-confirm]"), confirmText = q("[data-ri-confirm-text]"), sendBtn = q("[data-ri-send]");
  const resultsArea = q("[data-ri-results-area]"), countLine = q("[data-ri-count]"), list = q("[data-ri-results]"), retryBtn = q("[data-ri-retry]");
  let preview = null, order = [], names = new Map(), results = new Map(), busy = false, sentText = null;

  const cell = (tag, value, cls) => { const el = document.createElement(tag); el.textContent = value; if (cls) el.className = cls; return el; };
  const mark = (glyph, cls, label) => { const s = document.createElement("span"); s.className = "ri-mark " + cls; s.setAttribute("aria-hidden", "true"); s.textContent = glyph; const t = document.createElement("span"); t.className = cls; t.textContent = label; return [s, t]; };

  // Any edit after a preview voids it: what is confirmed is what was shown.
  // `sentText`: the CSV text last sent. 추가 stays off until the CSV changes (a resend would relabel 추가됨 as 이미 있음).
  const alreadySent = () => sentText !== null && text.value === sentText;
  function invalidate() { preview = null; area.hidden = true; confirmBox.checked = false; sendBtn.disabled = true; }
  // While a request is in flight the inputs are locked too, so a new file cannot discard that request's results.
  function syncSend() { sendBtn.disabled = busy || alreadySent() || !preview || !preview.valid || !confirmBox.checked; retryBtn.disabled = busy; previewBtn.disabled = busy; fileInput.disabled = busy; text.readOnly = busy; text.setAttribute("aria-busy", String(busy));
    if (!busy && preview) sendBtn.textContent = alreadySent() ? "보냈어요 · CSV를 바꾸면 다시 보낼 수 있어요" : "정상 " + preview.valid + "명 명단에 추가"; }

  function showPreview() {
    errorBox.innerHTML = ""; invalidate();
    const p = rosterCsv.preview(text.value);
    if (!p.ok) { errorBox.innerHTML = '<div class="banner err">' + esc(p.error) + ' 아무것도 보내지 않았어요.</div>'; return; }
    preview = p;
    summary.textContent = "정상 " + p.valid + " · 확인 필요 " + p.invalid;
    const table = document.createElement("table"); table.className = "ri-table";
    table.append(cell("caption", "보내기 전에 확인하세요. 확인 필요 줄은 보내지 않아요."));
    const head = document.createElement("tr");
    for (const h of ["줄", "handle"].concat(p.hasName ? ["name (화면 확인용)"] : [], ["상태"])) { const th = cell("th", h); th.scope = "col"; head.append(th); }
    const thead = document.createElement("thead"); thead.append(head); table.append(thead);
    const tbody = document.createElement("tbody");
    for (const r of p.rows) {
      const tr = document.createElement("tr"); if (!r.ok) tr.className = "ri-bad";
      tr.append(cell("td", String(r.line), "ri-line"), cell("td", r.handle, "ri-handle"));
      if (p.hasName) tr.append(cell("td", r.name));
      const st = document.createElement("td");
      st.append(...(r.ok ? mark("✓", "ri-ok", "정상") : mark("!", "ri-warn", "확인 필요 — " + r.reason)));
      tr.append(st); tbody.append(tr);
    }
    table.append(tbody); tableBox.replaceChildren(table);
    confirmText.textContent = p.valid ? "표를 확인했어요. 정상인 " + p.valid + "명의 handle만 보내요 (name 열은 이 가져오기에서 보내지 않아요)." : "보낼 수 있는 정상 줄이 없어요. 파일을 고친 뒤 다시 미리 보기를 눌러 주세요.";
    confirmBox.disabled = !p.valid;
    area.hidden = false; syncSend(); summary.focus();
  }

  function renderResults() {
    const c = rosterCsv.counts(order, results);
    countLine.textContent = "추가됨 " + c.added + " · 이미 있음 " + c.exists + " · 실패 " + c.failed;
    list.replaceChildren(...order.map((h) => {
      const r = results.get(h), li = document.createElement("li"), who = cell("span", h, "ri-who"), name = names.get(h);
      li.append(...(r.state === "added" ? mark("✓", "ri-ok", "추가됨") : r.state === "exists" ? mark("=", "ri-same", "이미 있음") : mark("✕", "ri-fail", "실패")));
      li.append(document.createTextNode(" · "), who);
      // <bdi> isolates the name's text direction so it cannot reorder the reason that follows it.
      if (name) { const b = document.createElement("bdi"); b.textContent = name; li.append(document.createTextNode(" ("), b, document.createTextNode(")")); }
      if (r.state === "failed") li.append(document.createTextNode(" — " + r.reason));
      li.dataset.state = r.state; li.dataset.handle = h;
      return li;
    }));
    retryBtn.hidden = !c.failed;
    resultsArea.hidden = false;
  }

  async function send(handles) {
    if (busy || !handles.length) return;
    busy = true; syncSend();
    const label = sendBtn.textContent; sendBtn.textContent = "보내는 중… (" + handles.length + "명)";
    let answer;
    try {
      const res = await fetch("/admin/cohorts/" + encodeURIComponent(scope.cohort) + "/roster/append", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(rosterCsv.requestBody(handles)),
      });
      answer = { status: res.status, body: await res.json().catch(() => null) };
    } catch { answer = { network: true }; }
    results = rosterCsv.merge(results, rosterCsv.mapAppend(handles, answer, mapServerError));
    busy = false; sendBtn.textContent = label;
    renderResults(); syncSend(); $(id + "-res").focus();
  }

  // A new input voids the preview but keeps the last result lines on screen; they are replaced when a new send starts.
  fileInput.onchange = async () => {
    errorBox.innerHTML = ""; invalidate();
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    if (f.size > rosterCsv.MAX_BYTES) { errorBox.innerHTML = '<div class="banner err">파일이 너무 커요. 64KB까지 받아요. 아무것도 보내지 않았어요.</div>'; return; }
    try { text.value = rosterCsv.decode(await f.arrayBuffer()); }
    catch { errorBox.innerHTML = '<div class="banner err">파일을 읽지 못했어요. 아무것도 보내지 않았어요.</div>'; return; }
    showPreview();
  };
  text.oninput = invalidate;
  previewBtn.onclick = showPreview;
  confirmBox.onchange = syncSend;
  sendBtn.onclick = () => {
    if (busy || alreadySent() || !preview || !confirmBox.checked) return;
    const ok = preview.rows.filter((r) => r.ok);
    order = ok.map((r) => r.handle); names = new Map(ok.filter((r) => r.name).map((r) => [r.handle, r.name])); results = new Map();
    sentText = text.value; send(order);
  };
  retryBtn.onclick = () => send(rosterCsv.failed(order, results));
}

// Lab keeps the short-lived distribution credentials; Service authorizes the read.
// This explicit lookup never reissues a token or persists student credentials in the browser.
function renderLabTokens(scope) {
  const wrap = document.createElement('fieldset');
  wrap.dataset.labTokens = scope.cohort;
  wrap.innerHTML = '<legend>④ Lab에서 발급한 학생 토큰 — ' + esc(scope.cohort) + '</legend>' +
    '<div class="help">현재 Lab 배부 보드의 토큰을 조회합니다. 이미 가져간 학생의 토큰도 담당 강사 권한으로 확인할 수 있어요. 만료되어 사라진 보드의 과거 토큰은 표시하지 않습니다.</div>' +
    '<button type="button" data-load-lab-tokens>Lab 학생 토큰 불러오기</button>' +
    '<div data-lab-token-results aria-live="polite"></div>';
  $('minter').appendChild(wrap);
  const btn = wrap.querySelector('[data-load-lab-tokens]');
  const out = wrap.querySelector('[data-lab-token-results]');
  btn.onclick = async () => {
    btn.disabled = true; out.textContent = '불러오는 중…';
    try {
      const body = await api('/admin/cohorts/' + encodeURIComponent(scope.cohort) + '/lab-tokens', { method: 'GET' });
      if (!body.board) { out.textContent = '현재 Lab 배부 보드가 없습니다. 아직 발급하지 않았거나 보드가 만료됐습니다.'; return; }
      const students = body.board.students;
      if (!Array.isArray(students)) throw new Error('Lab 조회 응답을 확인하지 못했습니다.');
      out.innerHTML = students.length ? students.map((student, i) =>
        '<div class="tok-line"><div class="name">' + esc(student.handle) + '</div>' +
        '<div class="help">' + (student.claimedBy ? '가져감 · ' + esc(student.claimedBy) : '아직 가져가지 않음') +
        (student.expiresAt ? ' · 만료 ' + esc(new Date(student.expiresAt).toLocaleString()) : '') + '</div>' +
        '<div class="token">' + esc(student.token) + '</div>' +
        '<button type="button" data-copy-lab="' + i + '">이 토큰만 복사</button></div>').join('') : '발급된 학생 토큰이 없습니다.';
      out.querySelectorAll('[data-copy-lab]').forEach(button => {
        button.onclick = () => window.chalkCopyFeedback(button, () => students[Number(button.dataset.copyLab)].token);
      });
    } catch (error) {
      out.innerHTML = '<div class="banner err">' + esc(error.message || '조회하지 못했습니다.') + '</div>';
    } finally { btn.disabled = false; }
  };
}

// Auto-load when the Lab connection is already there.
globalThis.chalkConnection?.ready.then((c) => { if (c.connected) load(); });
