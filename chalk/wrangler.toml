# Chalk pages and bounded Service HTTP transport. No participant storage or signing key.
name = "hypeproof-chalk"
main = "src/index.ts"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
account_id = "f1da7073b98021b4117c82a4a219eef0"
routes = [{ pattern = "chalk.hypeproof-ai.xyz", custom_domain = true }]

[observability]
enabled = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
ENVIRONMENT = "production"
HPS_SERVICE_ORIGIN = "https://api.hypeproof-ai.xyz"
# HPS_CHALK_VERSION is injected per deploy; unset means "unknown".
# Optional HPS_CHALK_SERVICE_SECRET (>=32 chars) attests an Access operator to
# the Service. Configure the same value on both servers during an approved
# rollout. It is not a token signing key and never belongs in App/browser code.
# Without it Access-only retrieval fails closed; the operator-secret path stays.

[env.dev]
name = "hypeproof-chalk-dev"
vars = { ENVIRONMENT = "dev", HPS_SERVICE_ORIGIN = "http://localhost:8787" }
