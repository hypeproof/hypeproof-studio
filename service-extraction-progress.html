<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Service 분리 진행 현황</title><style>body{background:#101722;color:#edf2fa;font:16px system-ui;max-width:850px;margin:40px auto;padding:24px}h1{font-size:28px}li{padding:14px;margin:8px 0;background:#1c2839;border-radius:9px;list-style:none}ul{padding:0}.state{float:right;color:#8bc4ff}p{color:#b8c5d7}small,a{color:#8bc4ff}</style><h1>Studio → Service 분리</h1><p id="phase">진행 현황 불러오는 중</p><p><a href="https://github.com/orgs/hypeproof/projects/1" target="_blank" rel="noopener noreferrer">칸반 열기 · 연결 작업 11개 Backlog</a></p><ul id="steps"></ul><div id="notes"></div><small>10초마다 현황을 갱신합니다.</small><script>async function refresh(){try{const s=await(await fetch('service-extraction-progress.json?ts='+Date.now())).json();document.getElementById('phase').textContent=s.phase;document.getElementById('steps').replaceChildren(...s.steps.map(x=>{let l=document.createElement('li'),b=document.createElement('span');l.textContent=x.name;b.className='state';b.textContent=x.status;l.append(b);return l}));document.getElementById('notes').replaceChildren(...s.notes.map(x=>{let p=document.createElement('p');p.textContent=x;return p}))}catch(e){document.getElementById('phase').textContent='진행 현황 연결을 확인 중입니다.'}}refresh();setInterval(refresh,10000)</script></html>
