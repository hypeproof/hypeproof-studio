version: 1

# Risk-tiered merge (hypeproof-harness#385; owner decision 2026-10-22, re-confirmed
# 2026-11-12).
#
#   Tier A  a changed path matches a `tier_a` glob below (after `exempt`). The PR
#           needs one approval from a human approver below, on its head commit, by
#           someone who is neither the author nor the last pusher. No bot merges
#           it: not hype-merge, not the loop, not `hype-pr --auto-merge`.
#   Tier B  everything else. It merges when the repository's required checks are
#           green and the latest hype-review has no blocker. No human approval.
#
# A PR's tier is the riskiest tier of its files. A file list that cannot be read in
# full, an empty one, or a repository missing below is a classification error, and
# every consumer of this file treats an error as "not tier B" (fail closed).
#
# Readers: scripts/merge-tier/merge_tier.py (the classifier and the `merge-tier`
# check), scripts/hype-merge, scripts/hype-pr (`--auto-merge`), scripts/loop/merge.py
# and scripts/merge-digest. scripts/sync.sh vendors this file to consumer repos as
# policy/merge-tiers.yaml next to scripts/merge-tier/.
#
# Globs: a trailing `/**` matches the directory and everything under it; otherwise
# fnmatch, case-sensitive, where `*` also crosses `/`; a leading `**/` also matches
# at the root. Paths were derived from each repository's `origin/main` tree on
# 2026-11-12 (`git ls-tree -r --name-only origin/main`). A glob that matches nothing
# today is allowed only when its comment says why.
#
# This file is itself control plane (policy/** in policy/control-plane.yaml) and is
# tier A in every repository through `common` below.

# Who may give the tier-A approval. Mirrors policy/control-plane.yaml
# human_approvers and the members.yaml admins; tests/merge_tier keeps the three equal.
human_approvers:
  - jayleekr
  - JeHyeong2
  - JinyongShin
  - TJ-kr
  - J3llyBe4n

# Never human, whatever they approve. Mirrors policy/control-plane.yaml.
automation_actors:
  - hypeproof-automation
  - hypeproof-agent[bot]
  - app/hypeproof-agent

# Tier A in every repository below. A repository may not have every one of these
# paths yet (sync.sh vendors policy/ and scripts/merge-tier/ later); a PR that adds
# one is tier A from then on.
common:
  tier_a:
    - {path: ".github/workflows/**", reason: CI workflows}
    - {path: ".github/CODEOWNERS", reason: control plane}
    - {path: ".githooks/**", reason: CI workflows}
    - {path: "policy/merge-tiers.yaml", reason: control plane}
    - {path: "scripts/merge-tier/**", reason: control plane}
    - {path: "scripts/repo-governance/**", reason: control plane}
    - {path: "scripts/security/check-secrets.sh", reason: auth/secrets}
    - {path: "CLAUDE.md", reason: control plane}
    - {path: "AGENTS.md", reason: control plane}
    - {path: "SECURITY.md", reason: control plane}

