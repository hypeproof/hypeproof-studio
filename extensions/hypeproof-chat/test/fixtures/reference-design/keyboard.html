<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthetic keyboard reference</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e4dc;color:#23262b;font:16px Arial,sans-serif}main{height:720px;width:960px;margin:auto;position:relative;overflow:hidden}h1{position:absolute;top:30px;left:60px;font-size:38px}.stage{position:absolute;left:170px;top:200px;width:620px;height:380px;perspective:900px}.shadow{position:absolute;left:30px;top:270px;width:560px;height:80px;border-radius:50%;background:#35353555;filter:blur(18px)}.box{position:absolute;left:40px;top:150px;width:540px;height:180px;background:#896345;border:3px solid #63432c;transform:rotate(-8deg);z-index:1}.keyboard{position:absolute;left:30px;top:10px;width:560px;height:240px;border:12px solid #393f49;border-radius:16px;background:#202632;box-shadow:0 18px 0 #14171d,0 28px 20px #0006;transform:rotateX(28deg) rotateZ(-8deg) translateY(var(--lift));z-index:2;padding:10px;display:grid;grid-template-rows:repeat(4,1fr);gap:7px}.row{display:flex;gap:6px}.key{background:#ede9db;border:1px solid #b7b5ab;border-bottom:5px solid #a5a69e;border-radius:4px;display:grid;place-items:center;flex:1;min-width:0;font-size:12px}.space{flex:6}.front{position:absolute;left:40px;top:242px;width:540px;height:110px;background:#a67e58;border:3px solid #63432c;transform:rotate(-8deg);z-index:3}button{position:absolute;left:60px;bottom:60px;padding:12px 20px;border:0;border-radius:10px;background:#283d59;color:white;cursor:pointer}output{position:absolute;left:250px;bottom:70px}
</style>
<main data-fixture="keyboard-emerging-v1" style="--lift:70px"><h1>A keyboard, ready to emerge</h1><div class="stage"><div class="shadow" data-semantic="cast-shadow"></div><div class="box" data-semantic="box"></div><div class="keyboard" role="img" aria-label="Tilted keyboard emerging from a box" data-semantic="keyboard"><div class="row"><span class="key">Q</span><span class="key">W</span><span class="key">E</span><span class="key">R</span><span class="key">T</span><span class="key">Y</span><span class="key">U</span><span class="key">I</span><span class="key">O</span><span class="key">P</span></div><div class="row"><span class="key">A</span><span class="key">S</span><span class="key">D</span><span class="key">F</span><span class="key">G</span><span class="key">H</span><span class="key">J</span><span class="key">K</span><span class="key">L</span></div><div class="row"><span class="key">Shift</span><span class="key">Z</span><span class="key">X</span><span class="key">C</span><span class="key">V</span><span class="key">B</span><span class="key">N</span><span class="key">M</span></div><div class="row"><span class="key">Ctrl</span><span class="key">Alt</span><span class="key space">Space</span><span class="key">Alt</span><span class="key">Ctrl</span></div></div><div class="front" data-semantic="box-front-occlusion"></div></div><button id="emerge" type="button">Show keyboard</button><output aria-live="polite">Closed</output></main>
<script>
// No clock, randomness, font or network dependencies. E2E can seek exact states.
window.fixture={revision:'keyboard-emerging-v1',viewport:{width:960,height:720,deviceScaleFactor:1},seek(progress){if(!Number.isFinite(progress)||progress<0||progress>1)throw Error('bad progress');document.querySelector('main').style.setProperty('--lift',`${70-140*progress}px`);document.querySelector('main').dataset.progress=String(progress);document.querySelector('output').textContent=progress===0?'Closed':progress===1?'Open':'Emerging';return progress}};
window.fixture.seek(0);document.querySelector('button').addEventListener('click',()=>window.fixture.seek(1));
</script></html>
