name: Studio native mobile
on:
  push:
    branches: ['main']
    paths: ['apps/studio-native/**', '.github/workflows/studio-native-mobile.yml', '.github/workflows/studio-apple-testflight.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: native / scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_native: ${{ steps.scope.outputs.run_native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify native scope from trusted base
        id: scope
        env:
          NATIVE_EVENT: ${{ github.event_name }}
          NATIVE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          NATIVE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_CHECKOUT: ${{ github.sha }}
        run: |
          trusted="$RUNNER_TEMP/native-merge-control"
          mkdir -p "$trusted"
          git show "$NATIVE_BASE:apps/studio-native/scripts/verify-native-candidate.py" > "$trusted/verify-native-candidate.py"
          receipt="$RUNNER_TEMP/native-merge-scope.json"
          if git cat-file -e "$NATIVE_BASE:apps/studio-native/scripts/native-merge-gate.py" 2>/dev/null; then
            git show "$NATIVE_BASE:apps/studio-native/scripts/native-merge-gate.py" > "$trusted/native-merge-gate.py"
            python3 "$trusted/native-merge-gate.py" scope --event "$NATIVE_EVENT" --base "$NATIVE_BASE" --head "$NATIVE_HEAD" --checkout "$NATIVE_CHECKOUT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --receipt "$receipt" --output "$receipt"
          else
            # The introducing PR cannot exempt itself with candidate-authored code.
            python3 - "$trusted/verify-native-candidate.py" "$receipt" <<'PYBOOT'
          import importlib.util, json, os, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('identity', sys.argv[1]); identity = importlib.util.module_from_spec(spec); spec.loader.exec_module(identity)
          source = identity.source_identity(Path.cwd())
          if source['checkout_sha'] != identity.sha(os.environ['NATIVE_CHECKOUT']): raise SystemExit('Wrong checkout')
          value = identity.identity_document(source, os.environ['NATIVE_HEAD'], int(os.environ['GITHUB_RUN_ID']), int(os.environ['GITHUB_RUN_ATTEMPT']))
          value.update(schema='hps-native-merge-bootstrap/1', base_sha=identity.sha(os.environ['NATIVE_BASE']), event=os.environ['NATIVE_EVENT'], decision='FULL')
          Path(sys.argv[2]).write_text(json.dumps(value, sort_keys=True) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('run_native=true\n')
          print('FULL: trusted native scope classifier not yet on base')
          PYBOOT
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-native-merge-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-merge-scope.json
          if-no-files-found: error
          retention-days: 14
  contract:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.run_native != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind native CI to the actual checked-out source
        env:
          NATIVE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 apps/studio-native/scripts/verify-native-candidate.py identity --output "$RUNNER_TEMP/native-candidate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-native-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-candidate.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify trusted native acceptance recipe controls
        run: python3 -m unittest discover -s apps/studio-native/tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native journey and release casebook agreement before platform builds
        run: node --test scripts/release/test/select-cases.test.mjs scripts/release/test/publish-gate.test.mjs
  ios:
    needs: contract
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 45 # 31 UI cases plus result finalization, cleanup and evidence upload
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build device binary and test native simulator
        env:
          NATIVE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash apps/studio-native/scripts/ios-verify.sh
      # Per-hop signed-in journey record for this exact run attempt. The TestFlight gate reads it;
      # a missing record means NOT_RUN, never PASS.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-native-signin-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/studio-native/evidence/signin-journey.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-ios-unsigned-${{ github.sha }}
          path: |
            apps/studio-native/evidence/
            apps/studio-native/ios/DerivedData-device/Build/Products/Release-iphoneos/*.app
          retention-days: 14
  android:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install emulator host library on the disposable runner
        run: |
          # Headless SDK QEMU still links to the PulseAudio client library.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Enable emulator acceleration on the disposable runner
        run: sudo chmod a+rw /dev/kvm
      - name: Provision the existing Android 35 emulator recipe
        run: |
          # yes may receive SIGPIPE after sdkmanager has consumed the licenses.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platform-tools' 'platforms;android-35' 'emulator' 'system-images;android-35;google_apis;x86_64' --channel=0
      - name: Native Android record and speech handoff journeys
        run: python3 apps/studio-native/scripts/android-emulator.py --sdk-root "$ANDROID_HOME" --work-dir "$RUNNER_TEMP/studio-native-android"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-android-preview-${{ github.sha }}
          path: |
            apps/studio-native/android/app/build/outputs/apk/debug/*.apk
            apps/studio-native/android/app/build/reports/
            apps/studio-native/android/app/build/outputs/androidTest-results/
            apps/studio-native/evidence/android/
          retention-days: 14
  voice-evaluation:
    needs: contract
    if: ${{ !cancelled() && needs.contract.result == 'success' }}
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual native LiveKit transport on an owned simulator
        run: python3 apps/studio-native/scripts/ios-livekit-verify.py --evidence apps/studio-native/evidence/voice-evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-native-livekit-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/studio-native/evidence/voice-evaluation/*.json
          if-no-files-found: error
          retention-days: 14
  acceptance:
    name: native / acceptance
    if: always()
    needs: [scope, contract, ios, android, voice-evaluation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: studio-native-merge-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-merge-scope
      - uses: actions/download-artifact@v4
        if: ${{ needs.scope.outputs.run_native != 'false' }}
        with:
          name: studio-native-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-merge-candidate
      - name: Verify exact native scope and existing job results
        if: always()
        env:
          NATIVE_EVENT: ${{ github.event_name }}
          NATIVE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          NATIVE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_CHECKOUT: ${{ github.sha }}
          NATIVE_SELECTED: ${{ needs.scope.outputs.run_native }}
          NATIVE_VOICE_RESULT: ${{ needs.voice-evaluation.result }}
          NATIVE_RESULTS: '{"scope":"${{ needs.scope.result }}","contract":"${{ needs.contract.result }}","ios":"${{ needs.ios.result }}","android":"${{ needs.android.result }}"}'
        run: |
          # Keep the trusted base's original join intact. The new actual transport
          # job is an additional prerequisite, including during first adoption.
          expected_voice=success
          if [ "$NATIVE_SELECTED" = 'false' ]; then expected_voice=skipped; fi
          if [ "${NATIVE_VOICE_RESULT:-}" != "$expected_voice" ]; then
            echo 'Native voice transport did not satisfy the selected scope' >&2
            exit 1
          fi
          trusted="$RUNNER_TEMP/native-merge-control"
          mkdir -p "$trusted"
          git show "$NATIVE_BASE:apps/studio-native/scripts/verify-native-candidate.py" > "$trusted/verify-native-candidate.py"
          receipt="$RUNNER_TEMP/native-merge-scope/native-merge-scope.json"
          candidate="$RUNNER_TEMP/native-merge-candidate/native-candidate.json"
          output="$RUNNER_TEMP/native-merge-acceptance.json"
          if git cat-file -e "$NATIVE_BASE:apps/studio-native/scripts/native-merge-gate.py" 2>/dev/null; then
            git show "$NATIVE_BASE:apps/studio-native/scripts/native-merge-gate.py" > "$trusted/native-merge-gate.py"
            args=()
            if [ "$NATIVE_SELECTED" != 'false' ]; then args=(--candidate "$candidate"); fi
            python3 "$trusted/native-merge-gate.py" verify --event "$NATIVE_EVENT" --base "$NATIVE_BASE" --head "$NATIVE_HEAD" --checkout "$NATIVE_CHECKOUT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --receipt "$receipt" --results "$NATIVE_RESULTS" --output "$output" "${args[@]}"
          else
            python3 - "$trusted/verify-native-candidate.py" "$receipt" "$candidate" "$output" <<'PYBOOT'
          import importlib.util, json, os, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('identity', sys.argv[1]); identity = importlib.util.module_from_spec(spec); spec.loader.exec_module(identity)
          source = identity.source_identity(Path.cwd())
          if source['checkout_sha'] != identity.sha(os.environ['NATIVE_CHECKOUT']): raise SystemExit('Wrong checkout')
          expected = identity.identity_document(source, os.environ['NATIVE_HEAD'], int(os.environ['GITHUB_RUN_ID']), int(os.environ['GITHUB_RUN_ATTEMPT']))
          expected.update(schema='hps-native-merge-bootstrap/1', base_sha=identity.sha(os.environ['NATIVE_BASE']), event=os.environ['NATIVE_EVENT'], decision='FULL')
          results = json.loads(os.environ['NATIVE_RESULTS'])
          if results != dict(scope='success', contract='success', ios='success', android='success') or json.loads(Path(sys.argv[2]).read_text()) != expected: raise SystemExit('First adoption requires exact scope and all native jobs succeeding')
          candidate = json.loads(Path(sys.argv[3]).read_text())
          identity.verify_identity(candidate, source, dict(head_sha=os.environ['NATIVE_HEAD'], id=int(os.environ['GITHUB_RUN_ID']), run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])))
          if candidate['checkout_sha'] != source['checkout_sha']: raise SystemExit('Wrong native candidate checkout')
          Path(sys.argv[4]).write_text(json.dumps(dict(schema='hps-native-merge-acceptance/1', verdict='PASS', scope=expected, jobs=results, native_execution='PASS', release_authorization='NOT_GRANTED'), sort_keys=True) + '\n')
          print('PASS: existing contract, iOS and Android jobs succeeded for this source/run/attempt')
          PYBOOT
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-native-merge-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-merge-acceptance.json
          if-no-files-found: ignore
          retention-days: 14
