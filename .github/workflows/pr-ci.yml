name: studio-pr-ci

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'packages/measurement/**'
      - 'package.json'
      - 'package-lock.json'
      - 'config/service-packages.json'
      - 'scripts/bootstrap-service-packages.mjs'
      - 'scripts/test/bootstrap-service-packages.test.mjs'
      - 'test/service-integration/**'
      - 'chalk/**'
      - 'extensions/hypeproof-chat/**'
      - '.github/workflows/pr-ci.yml'

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress. Runs on
# main are never cancelled.
concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Four groups of controls that need no Service install and finish in seconds.
  # They were four jobs, each billed as a whole minute. Every step runs even
  # when an earlier one fails, so one failure does not hide another.
  repo-controls:
    name: repo / release and measurement controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: packages/measurement/package-lock.json
      - run: pip install --quiet pyyaml
      - name: Portable feedback evidence integrity
        if: ${{ !cancelled() }}
        run: python3 scripts/test-feedback-report.py
      - name: Usage migration release guards
        run: node scripts/test-usage-schema.mjs
      # A bash body on a Windows runner without `shell: bash` parses as
      # PowerShell and dies on its first POSIX token. v0.0.0-rc.2 published a
      # release and then failed exactly that way.
      # Studio is meant to become public; customer names live only in the
      # private Service package. The denylist is digests, never names.
      - name: No customer names in tracked files
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/test-check-customer-names.py
          python3 scripts/check-customer-names.py
      - name: Workflow shells declare bash on Windows runners
        if: ${{ !cancelled() }}
        run: python3 scripts/check-workflow-shells.py
      # #632 sized the mirror's asset wait for two 1-2h builds and then
      # wrapped it in a 20-minute job. Both numbers looked deliberate;
      # nobody compared them until v0.0.0-rc.3 was cancelled mid-wait.
      - name: Mirror wait fits inside its job timeout
        if: ${{ !cancelled() }}
        run: python3 scripts/check-mirror-timeout.py
      - name: Unified release verdict and launcher recovery controls
        if: ${{ !cancelled() }}
        run: |
          node e2e/unified-release/gate.test.mjs
          node --test scripts/release/test/build-contract.test.mjs
          node e2e/unified-release/sdk-seed.test.mjs
          node --test e2e/unified-release/candidate-service.test.mjs
          node --test scripts/test/windows-policy-patch.test.mjs
          node --test scripts/release/test/engine.test.mjs
          node --test e2e/paid-pass-recovery/proxy.test.mjs e2e/paid-pass-recovery/contract.test.mjs e2e/paid-pass-recovery/lifecycle.test.mjs
          node scripts/test-unified-launcher.mjs
      - name: Release cut and publish gate controls
        if: ${{ !cancelled() }}
        run: node --test scripts/release/test/release-cut.test.mjs scripts/release/test/publish-gate.test.mjs
      - name: review-pr.sh shell safety (#1302 SIGPIPE + ERR trap)
        if: ${{ !cancelled() }}
        run: bash scripts/test/review-pr-shell.test.sh
      # dag.yaml task A control: the --prerelease decision used by
      # build-mac.yml / build-windows.yml must be testable without cutting a
      # real tag. Runs in milliseconds, no build/app required.
      - name: Regression — tag-is-prerelease positive + negative controls
        if: ${{ !cancelled() }}
        run: bash scripts/test-tag-is-prerelease.sh
      # dag.yaml task D control (#676): the live-class freeze used by
      # deploy-worker.yml / build-mac.yml / build-windows.yml must be
      # exercisable with no live class and no real deploy. Fixtures + a
      # planted clock; milliseconds, no network. Includes the fail-closed
      # cases, which are the ones nobody would otherwise ever see run.
      - name: Regression — live-session freeze positive/negative/override controls
        if: ${{ !cancelled() }}
        run: node scripts/test-check-live-sessions.mjs
      - name: Owner console read-only smoke controls
        if: ${{ !cancelled() }}
        run: node scripts/test-owner-console.mjs
      - name: Private Service package integrity and boundary controls
        if: ${{ !cancelled() }}
        run: npm run test:private-service-packages
      - name: Bootstrap pinned private Service packages
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - name: Measurement — released package compatibility
        if: ${{ !cancelled() }}
        working-directory: packages/measurement
        run: |
          npm ci
          npm test

  # Context names stay compatible with existing protection until canonical policy adoption.
  # Server-only validation lives in hypeproof-service; this lane preserves App integration.
  worker-test:
    name: worker / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap pinned private Service packages
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - run: npm ci
      - run: npm ci
        working-directory: extensions/hypeproof-chat
      - run: npm ci
        working-directory: extensions/hypeproof-chat/webview-ui
      - run: npm ci
        working-directory: e2e
      - name: Cross-product checks against the pinned private Service runtime
        run: npm run test:service-integration

  worker-typecheck:
    name: worker / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap pinned private Service packages
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - run: npm ci
      - name: Typecheck the pinned private Service reference source
        run: node node_modules/typescript/bin/tsc -p "$(node scripts/service-tooling.mjs)/tsconfig.json"

  # Chalk (chalk/) — the instructor surface, its own Worker on the c* train
  # (plan task F). HTTP clients use the public contract; tests install the
  # pinned private Service reference artifact. `npm test` includes controls:
  # instructor-auth-drift (one verifier, two workers) and deploy-isolation
  # (a c* deploy cannot move the Service's version).
  chalk-test:
    name: chalk / typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chalk/package-lock.json
      - name: Bootstrap pinned private Service packages
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - name: Install chalk deps
        id: chalk_install
        working-directory: chalk
        run: npm ci
      - name: Typecheck chalk
        working-directory: chalk
        run: npm run typecheck
      # The tests still run when the typecheck fails, so one report shows both.
      - name: Install App dependencies for cross-product contract tests
        id: app_install
        if: ${{ !cancelled() && steps.chalk_install.outcome == 'success' }}
        working-directory: extensions/hypeproof-chat
        run: npm ci --ignore-scripts --omit=optional
      - name: Run chalk tests
        if: ${{ !cancelled() && steps.app_install.outcome == 'success' }}
        working-directory: chalk
        run: npm test

  extension-typecheck:
    name: extension / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/hypeproof-chat/package-lock.json
      - name: Bootstrap pinned private Service packages
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - name: Install extension deps
        # --omit=optional skips @anthropic-ai/claude-agent-sdk's ~250 MB native
        # `claude` binary package (#282) — typecheck/smoke never spawn it.
        working-directory: extensions/hypeproof-chat
        run: npm ci
      - name: Typecheck extension
        working-directory: extensions/hypeproof-chat
        run: npm run typecheck

  extension-test:
    name: extension / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/hypeproof-chat/package-lock.json
      - name: Bootstrap pinned private Service packages
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - name: Install pinned private Service testkit
        run: npm ci
      - name: Install extension deps
        # --omit=optional skips @anthropic-ai/claude-agent-sdk's ~250 MB native
        # `claude` binary package (#282) — typecheck/smoke never spawn it.
        working-directory: extensions/hypeproof-chat
        run: npm ci
      # The render instrument (`test/sx-render.mjs`) resolves react from
      # webview-ui. Without these deps `rendererStatus()` reports
      # `webview-deps-missing` and EVERY screen test skips — which is what was
      # happening: the SX-59 work-screen gate had no CI enforcement at all, and
      # a suite reported as "0 fail" was 100% skipped.
      - name: Install webview deps (the render instrument needs react)
        working-directory: extensions/hypeproof-chat/webview-ui
        run: npm ci
      # U-layer pure smoke tests (test/*.smoke.mjs) — no vscode host needed.
      - name: Run extension smoke tests
        working-directory: extensions/hypeproof-chat
        run: npm test

  # The Windows leg for the extension smokes whose verdict depends on the host
  # (ADR 0011 rollout, WP A1). Every other job here runs on Ubuntu, where a
  # Windows-only break cannot show: `path` resolves drive letters and
  # separators differently there, and seed-sdk-binary.ps1 is the seeder venue
  # Windows machines run. These smokes import only Node built-ins and the
  # extension's own modules (SDK imports are type-only and stripped), so the
  # job needs no npm install and no Service secret. It costs one Windows
  # minute, about two Linux minutes, per run.
  #   shell-policy      shell-gate controls (WP A3 adds the PowerShell verbs)
  #   absolutize-paths  relative-path absolutizing and the workspace
  #                     containment deny under Windows path rules
  #   sdk-binary        both seed scripts against the manifest and lockfile,
  #                     and the seeded binary path per platform
  #   sdk-vendor        the vendored SDK entry a packaged build loads
  #   consult-tool      the orchestrator consult's context containment (WP A4):
  #                     outside, absolute, drive-letter, backslash and traversal
  #                     paths refused before any request (its symlink case
  #                     skips itself without the privilege)
  extension-windows:
    name: extension / windows smokes
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Every smoke runs even when an earlier one fails, so one failure does
      # not hide another.
      - name: Run platform-sensitive smokes (no install needed)
        shell: bash
        working-directory: extensions/hypeproof-chat
        run: |
          failed=0
          for f in test/shell-policy.smoke.mjs test/absolutize-paths.smoke.mjs test/sdk-binary.smoke.mjs test/sdk-vendor.smoke.mjs test/consult-tool.smoke.mjs; do
            echo "— $f"
            node --experimental-strip-types "$f" || { echo "::error file=extensions/hypeproof-chat/$f::smoke failed on Windows"; failed=1; }
          done
          exit "$failed"
      # The smokes read seed-sdk-binary.ps1 as text. This parses it with
      # Windows PowerShell 5.1, the shell venue machines run, so an edit that
      # breaks its syntax fails here instead of on a student's machine. The
      # parser must first reject a broken snippet, or a pass would prove
      # nothing.
      - name: Parse seed-sdk-binary.ps1 with Windows PowerShell 5.1
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $bad = $null
          [System.Management.Automation.Language.Parser]::ParseInput('function f( {', [ref]$null, [ref]$bad) | Out-Null
          if (-not ($bad -and $bad.Count)) { Write-Host 'control failed: the parser accepted broken input'; exit 1 }
          $errs = $null
          $full = (Resolve-Path -LiteralPath 'scripts/seed-sdk-binary.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$null, [ref]$errs) | Out-Null
          if ($errs -and $errs.Count) {
            $errs | Select-Object -First 5 | ForEach-Object { Write-Host ('line {0}: {1}' -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }
          Write-Host "seed-sdk-binary.ps1 parses under PowerShell $($PSVersionTable.PSVersion) with 0 errors"

  cr-publish-browser:
    # cr-publish (#1393): the published test runtime in real Chromium as a phone (CR-T18,
    # CR-T19 incl. the service-worker and sibling-link cases, CR-T21 one visit, CR-T22, CR-T60,
    # CR-T61). Synthetic: the real Service router over local SQLite and an in-memory R2.
    name: cr-publish / real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bootstrap pinned private Service packages
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - name: Install extension deps
        working-directory: extensions/hypeproof-chat
        run: npm ci
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run the published runtime in real Chromium
        working-directory: e2e
        run: npm run test:cr-publish
      # cr-evidence (#1394): participant events from the same runtime (CR-T23, CR-T62, CR-T67, CR-T19 events half).
      - name: Run participant events in real Chromium
        working-directory: e2e
        run: npm run test:cr-evidence
