name: Verify and publish Unified Studio
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate App tag
        required: true
      override_live_session:
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
  pull-requests: read
concurrency:
  group: unified-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      published: ${{ steps.candidate.outputs.published }}
      matrix: ${{ steps.candidate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Which OS packages to wait for, test and require comes from the tag's own
      # config/release-platforms.json (scripts/release/platforms.mjs). Mac only
      # since 2026-10-19; a tag without that file requires both.
      - name: Wait for every configured candidate package
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          sha="$(git rev-parse "$TAG^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "matrix=$(node scripts/release/platforms.mjs matrix "$sha")" >> "$GITHUB_OUTPUT"
          echo "release platforms: $(node scripts/release/platforms.mjs list "$sha")"
          for attempt in $(seq 1 150); do
            gh release view "$TAG" --json isDraft,assets > "$RUNNER_TEMP/candidate.json"
            # Duplicate builder dispatch after successful promotion is read-only.
            if jq -e '.isDraft == false' "$RUNNER_TEMP/candidate.json" >/dev/null; then
              gh release download "$TAG" --dir "$RUNNER_TEMP/already-published"
              node scripts/check-unified-release.mjs "$RUNNER_TEMP/already-published" "$sha" "${TAG#v}"
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # set -e + pipefail: a helper failure stops the job; empty output = complete.
            jq -r '.assets[].name' "$RUNNER_TEMP/candidate.json" | node scripts/release/platforms.mjs missing "$sha" > "$RUNNER_TEMP/missing.txt"
            if [[ ! -s "$RUNNER_TEMP/missing.txt" ]]; then exit 0; fi
            sleep 60
          done
          echo "Configured OS packages did not arrive (missing: $(paste -sd, "$RUNNER_TEMP/missing.txt")); candidate remains draft." >&2
          exit 1
  acceptance:
    needs: candidate
    if: needs.candidate.outputs.published != 'true'
    strategy:
      fail-fast: false
      # One session key per cohort: each OS run opens and closes the synthetic
      # acceptance session (#1404), so the two must not overlap.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.candidate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - name: Require live acceptance credential
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.HPS_ACCEPTANCE_ANTHROPIC_API_KEY }}
        run: test -n "$ANTHROPIC_API_KEY" || { echo 'BLOCKED missing acceptance credential'; exit 1; }
      - name: Bootstrap pinned private Service packages
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix e2e
      - name: Resolve pinned Service source
        id: service
        shell: bash
        run: echo "sha=$(node -p "require('./config/service-deployment.json').sha")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hypeproof/hypeproof-service
          ref: ${{ steps.service.outputs.sha }}
          token: ${{ secrets.HYPEPROOF_READ_TOKEN }}
          path: .service-source
      - name: Install candidate Service dependencies
        working-directory: .service-source
        run: npm run setup:packages -- worker
      - name: Download untouched candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-assets" "$RUNNER_TEMP/candidate-app" "$RUNNER_TEMP/unified-evidence"
          gh release download "$TAG" --dir "$RUNNER_TEMP/candidate-assets"
      - name: Extract Mac package
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -xk "$RUNNER_TEMP/candidate-assets/HypeProof-Studio-darwin-arm64.zip" "$RUNNER_TEMP/candidate-app"
      - name: Extract Windows package and verify installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = @(Get-ChildItem "$env:RUNNER_TEMP/candidate-assets/*win32-x64*.zip")
          if ($asset.Count -ne 1) { throw 'Expected one Windows package' }
          Expand-Archive -LiteralPath $asset[0].FullName -DestinationPath "$env:RUNNER_TEMP/candidate-app"
          node e2e/unified-release/install-windows.mjs "$env:RUNNER_TEMP/candidate-assets" "$env:RUNNER_TEMP/candidate-app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # hypeproof/hypeprooflab#997: same per-machine SDK binary precondition as
      # verify-service-activities.yml; run.mjs refuses to start without it.
      - name: Seed the Agent SDK binary the candidate expects
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/seed-sdk-binary.sh --version "$(node e2e/unified-release/sdk-seed.mjs version "$RUNNER_TEMP/candidate-app/HypeProof Studio.app")"
      - name: Seed the Agent SDK binary the candidate expects
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node e2e/unified-release/sdk-seed.mjs version "$env:RUNNER_TEMP/candidate-app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/seed-sdk-binary.ps1 -Version $version
      - name: Both activities in the shipped App
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.HPS_ACCEPTANCE_ANTHROPIC_API_KEY }}
          HPS_SERVICE_SOURCE: ${{ github.workspace }}/.service-source
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/candidate-app"
          if [[ "$RUNNER_OS" == macOS ]]; then app="$app/HypeProof Studio.app"; fi
          node e2e/unified-release/run.mjs "$app" "$RUNNER_TEMP/candidate-assets" "$RUNNER_TEMP/unified-evidence" "$SOURCE_SHA" "${TAG#v}"
      - name: Candidate App against the current public Service
        shell: bash
        env:
          # #1404 — per-run synthetic codes and a short session on the synthetic
          # acceptance cohort. The scoped issuer is preferred; the admin secret
          # the publish job's freeze already uses is the fallback, so no new
          # long-lived secret is required. public.mjs strips all of these from
          # the App's environment.
          HPS_ACCEPTANCE_ISSUER: ${{ secrets.HPS_ACCEPTANCE_ISSUER }}
          HPS_ADMIN_PASSWORD: ${{ secrets.HPS_ADMIN_PASSWORD }}
          # Pre-#1404 static codes: read only when neither credential is set.
          HPS_ACCEPTANCE_TRIAL_CODE: ${{ secrets.HPS_ACCEPTANCE_TRIAL_CODE }}
          HPS_ACCEPTANCE_CLASSROOM_CODE: ${{ secrets.HPS_ACCEPTANCE_CLASSROOM_CODE }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/candidate-app"
          if [[ "$RUNNER_OS" == macOS ]]; then app="$app/HypeProof Studio.app"; fi
          node e2e/unified-release/public.mjs "$app" "$RUNNER_TEMP/unified-evidence/public" "$SOURCE_SHA" "${TAG#v}"
      - name: Upload synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-${{ matrix.platform }}
          path: ${{ runner.temp }}/unified-evidence/
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: [candidate, acceptance]
    if: needs.candidate.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - uses: actions/download-artifact@v4
        with:
          pattern: unified-*
          path: receipts
      - name: Verify current asset bytes against both acceptance receipts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$TAG" --dir dist
          PLATFORMS="$(node scripts/release/platforms.mjs list "$SOURCE_SHA")" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipts=JSON.parse(process.env.PLATFORMS).map(os=>JSON.parse(fs.readFileSync('receipts/unified-'+os+'/receipt.json','utf8')));
          fs.writeFileSync('dist/unified-acceptance.json',JSON.stringify({schema:'hps-unified-release/1',receipts},null,2));
          NODE
          node scripts/check-unified-release.mjs dist "$SOURCE_SHA" "${TAG#v}"
      - name: Confirm the public Service still matches acceptance
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected=JSON.parse(fs.readFileSync('dist/unified-acceptance.json','utf8')).receipts[0].publicService;
          const response=await fetch(expected.base+'/health',{signal:AbortSignal.timeout(15000)});
          if(!response.ok||(await response.json()).version!==expected.version)throw Error('Public Service changed; rerun acceptance');
          NODE
      - name: Live-session freeze immediately before publication
        env:
          HPS_ADMIN_PASSWORD: ${{ secrets.HPS_ADMIN_PASSWORD }}
          HPS_FREEZE_OVERRIDE: ${{ inputs.override_live_session }}
          HPS_FREEZE_CONTEXT: Unified Studio accepted candidate publication
          TAG: ${{ inputs.tag }}
        run: bash scripts/release-freeze-gate.sh "refs/tags/$TAG"
      # A tag can be pushed by anyone with write access (no tag protection on this plan).
      # A stable tag is published only with an approved release PR or as a hotfix; otherwise
      # the release stays a draft. Rerun this workflow after the approval to publish it.
      - name: Publish gate — approved release PR or hotfix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: node scripts/release/publish-gate.mjs --tag "$TAG"
      # studio-public-sdk-seed (US-01). The zips vendor the Agent SDK JS but never
      # the native `claude` binary, and verify-branding.sh keeps it that way. A
      # public-zip user has no installer to seed it, so the release carries the
      # unmodified npm tarball for each App platform, a sha256 file beside it and
      # sdk-seed.json. Attached while still a draft: a public release never
      # appears without its seed, and a failure here leaves the draft unpublished.
      # The seed covers the platforms this release ships (config/release-platforms.json at
      # the release's own commit, like the gates above): a Mac-only release carries only
      # the darwin-arm64 seed. The App reads only its own platform's entry, and Windows
      # installs fall back to the newest release with Windows assets and its own seed.
      - name: Attach the public native SDK seed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/sdk-meta" seed="$RUNNER_TEMP/sdk-seed"
          mkdir -p "$meta"
          platforms="$(node scripts/release/platforms.mjs list "$SOURCE_SHA")"
          echo "native SDK seed platforms: $platforms"
          vendored='extensions/hypeproof-chat/dist/vendor/node_modules/@anthropic-ai/claude-agent-sdk/package.json'
          metas=()
          for platform in $(jq -r '.[]' <<<"$platforms"); do
            case "$platform" in
              darwin-arm64)
                unzip -p dist/HypeProof-Studio-darwin-arm64.zip "HypeProof Studio.app/Contents/Resources/app/$vendored" > "$meta/$platform.json" ;;
              win32-x64)
                win_zips=(dist/HypeProof.Studio-win32-x64-*.zip)
                [[ ${#win_zips[@]} -eq 1 && -f "${win_zips[0]}" ]] || { echo "::error::expected one Windows zip in the release"; exit 1; }
                unzip -p "${win_zips[0]}" "resources/app/$vendored" > "$meta/$platform.json" ;;
              *) echo "::error::no seed recipe for platform $platform"; exit 1 ;;
            esac
            metas+=("$meta/$platform.json")
          done
          # The version the shipped Apps vendor, not the one main pins today.
          version="$(node scripts/release/sdk-seed-assets.mjs app-version "${metas[@]}")"
          pinned="$(git show "$TAG:extensions/hypeproof-chat/src/sdkBinaryManifest.ts" | sed -n 's/^export const SDK_BINARY_VERSION = "\([0-9.]*\)";.*/\1/p')"
          [[ "$version" == "$pinned" ]] || { echo "::error::Apps vendor Agent SDK $version but $TAG pins SDK_BINARY_VERSION=$pinned"; exit 1; }
          # --version: the pinned sha512 when main pins the same version, npm's
          # dist.integrity otherwise. Either way the bytes are npm's.
          for platform in $(jq -r '.[]' <<<"$platforms"); do
            bash scripts/seed-sdk-binary.sh --platform "$platform" --version "$version" --download-only "$seed"
          done
          node scripts/release/sdk-seed-assets.mjs manifest "$seed" "$version" "$platforms"
          gh release upload "$TAG" "$seed"/* --clobber
          gh release view "$TAG" --json assets | node scripts/release/sdk-seed-assets.mjs list "$version" "$platforms"
      - name: Publish and dispatch the public mirror
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft --jq .isDraft | grep -qx true
          gh release upload "$TAG" dist/unified-acceptance.json --clobber
          gh release edit "$TAG" --draft=false
          gh workflow run mirror-release.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG" -f dry_run=false
