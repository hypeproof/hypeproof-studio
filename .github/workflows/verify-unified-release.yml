name: Verify and publish Unified Studio
run-name: Verify Studio ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate App tag
        required: true
      override_live_session:
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
  pull-requests: read
concurrency:
  group: unified-release-${{ inputs.tag }}
  cancel-in-progress: false
env:
  RELEASE_ENGINE_ENABLED: ${{ vars.RELEASE_ENGINE_ENABLED }}
  RELEASE_ENGINE_URL: ${{ vars.RELEASE_ENGINE_URL }}

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    permissions:
      contents: read
      actions: read
      id-token: write # collection storage reservation only
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      published: ${{ steps.candidate.outputs.published }}
      managed: ${{ steps.candidate.outputs.managed }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for both candidate packages
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          HPS_CANDIDATE_INPUT: ${{ runner.temp }}/candidate-input.json
        run: |
          set -euo pipefail
          node scripts/release/cloud-executor/workflow-input.mjs
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          sha="$(git rev-parse "$TAG^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 150); do
            gh release view "$TAG" --json isDraft,assets > "$RUNNER_TEMP/candidate.json"
            # Duplicate builder dispatch after successful promotion is read-only.
            if jq -e '.isDraft == false' "$RUNNER_TEMP/candidate.json" >/dev/null; then
              gh release download "$TAG" --dir "$RUNNER_TEMP/already-published"
              node scripts/check-unified-release.mjs "$RUNNER_TEMP/already-published" "$sha" "${TAG#v}"
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if jq -e '[.assets[].name] | any(. == "HypeProof-Studio-darwin-arm64.zip") and any(test("win32-x64.*\\.zip$")) and any(test("UserSetup.*\\.exe$")) and any(test("(?<!User)Setup.*\\.exe$"))' "$RUNNER_TEMP/candidate.json" >/dev/null; then exit 0; fi
            sleep 60
          done
          echo 'Both OS packages did not arrive; candidate remains draft.' >&2
          exit 1
      - name: Require current artifact storage reservation
        id: artifact-budget-1
        if: always()
        shell: bash
        env:
          HPS_ENGINE_ARTIFACT_NAME: managed-candidate-input
          HPS_ENGINE_IDENTITY_FILE: ${{ runner.temp }}/candidate-input.json
        run: node scripts/release/cloud-executor/workflow-gate.mjs authorize candidate:artifact-store artifact-store
      - name: Archive exact managed candidate input
        id: stored-artifact-1
        if: always() && steps.artifact-budget-1.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: managed-candidate-input
          path: ${{ runner.temp }}/candidate-input.json
          if-no-files-found: error
          retention-days: 14
      - name: Reconcile immutable stored artifact using fresh workflow identity
        if: always() && steps.stored-artifact-1.outcome == 'success'
        shell: bash
        env:
          HPS_ENGINE_ARTIFACT_NAME: managed-candidate-input
          HPS_ENGINE_IDENTITY_FILE: ${{ runner.temp }}/candidate-input.json
          HPS_ENGINE_ARTIFACT_ID: ${{ steps.stored-artifact-1.outputs.artifact-id }}
        run: node scripts/release/cloud-executor/workflow-gate.mjs complete candidate:artifact-store artifact-store
  collect-managed:
    environment: release-collection
    needs: candidate
    if: needs.candidate.outputs.managed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write # collection storage reservation only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - uses: actions/download-artifact@v4
        with:
          name: managed-candidate-input
          path: ${{ runner.temp }}/managed-input
      - name: Collect numeric draft and exact successful build attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/cloud-executor/collect-candidate.mjs "${{ runner.temp }}/managed-input/candidate-input.json" "${{ runner.temp }}/managed-assets"
      - name: Register exact collected receipts and immutable artifact bytes
        run: node scripts/release/cloud-executor/evidence-client.mjs collection "${{ runner.temp }}/managed-assets/collection.json"
      - name: Resolve untouched previous supported packages
        id: previous
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/cloud-executor/previous-release.mjs "${{ runner.temp }}/managed-assets/collection.json" "${{ runner.temp }}/managed-assets/previous"
      - name: Require current artifact storage reservation
        id: artifact-budget-2
        if: always()
        shell: bash
        env:
          HPS_ENGINE_ARTIFACT_NAME: managed-candidate-bytes
          HPS_ENGINE_IDENTITY_FILE: ${{ runner.temp }}/managed-assets/collection.json
        run: node scripts/release/cloud-executor/workflow-gate.mjs authorize collect-managed:artifact-store artifact-store
      - name: Archive exact bytes and collection
        id: stored-artifact-2
        if: steps.artifact-budget-2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: managed-candidate-bytes
          path: ${{ runner.temp }}/managed-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Reconcile immutable stored artifact using fresh workflow identity
        if: always() && steps.stored-artifact-2.outcome == 'success'
        shell: bash
        env:
          HPS_ENGINE_ARTIFACT_NAME: managed-candidate-bytes
          HPS_ENGINE_IDENTITY_FILE: ${{ runner.temp }}/managed-assets/collection.json
          HPS_ENGINE_ARTIFACT_ID: ${{ steps.stored-artifact-2.outputs.artifact-id }}
        run: node scripts/release/cloud-executor/workflow-gate.mjs complete collect-managed:artifact-store artifact-store
  installed-managed:
    needs: [candidate, collect-managed]
    if: needs.candidate.outputs.managed == 'true'
    environment: release-verification
    strategy:
      fail-fast: false
      # Actual public flow fixtures own one synthetic acceptance session.
      max-parallel: 1
      matrix:
        include:
          - os: macos-15
            target: mac
          - os: windows-latest
            target: win-user
          - os: windows-latest
            target: win-system
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write # exact protected verifier; build jobs cannot use this signer audience
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - uses: actions/download-artifact@v4
        with:
          name: managed-candidate-bytes
          path: ${{ runner.temp }}/managed-assets
      - name: Obtain canonical pinned verification context
        id: context
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/release/cloud-executor/evidence-client.mjs context "$RUNNER_TEMP/managed-assets/collection.json" "$RUNNER_TEMP/verification-context.json" "$TARGET"
      - name: Require independently reserved native verification budget
        shell: bash
        env:
          HPS_ENGINE_IDENTITY_FILE: ${{ runner.temp }}/managed-assets/collection.json
          TARGET: ${{ matrix.target }}
        run: node scripts/release/cloud-executor/workflow-gate.mjs authorize "installed:$TARGET" verify-start
      - name: Bootstrap pinned Service test dependencies
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - name: Install native driver dependencies
        run: npm ci --prefix e2e
      - name: Resolve pinned Service source
        id: service
        shell: bash
        run: echo "sha=$(node -p "require(process.env.RUNNER_TEMP+'/verification-context.json').serviceSha")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hypeproof/hypeproof-service
          ref: ${{ steps.service.outputs.sha }}
          token: ${{ secrets.HYPEPROOF_READ_TOKEN }}
          path: .service-source
      - name: Install pinned Service packages
        working-directory: .service-source
        run: npm run setup:packages -- worker
      - name: Extract untouched portable reference (Mac)
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -xk "$RUNNER_TEMP/managed-assets/HypeProof-Studio-darwin-arm64.zip" "$RUNNER_TEMP/portable-reference"
      - name: Extract untouched portable reference and verify both installer payloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = @(Get-ChildItem "$env:RUNNER_TEMP/managed-assets/*win32-x64*.zip")
          if ($asset.Count -ne 1) { throw 'Expected exactly one untouched portable package' }
          Expand-Archive -LiteralPath $asset[0].FullName -DestinationPath "$env:RUNNER_TEMP/portable-reference"
          node e2e/unified-release/install-windows.mjs "$env:RUNNER_TEMP/managed-assets" "$env:RUNNER_TEMP/portable-reference"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Seed pinned SDK for Mac native runner
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/seed-sdk-binary.sh --version "$(node e2e/unified-release/sdk-seed.mjs version "$RUNNER_TEMP/portable-reference/HypeProof Studio.app")"
      - name: Seed pinned SDK for Windows native runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node e2e/unified-release/sdk-seed.mjs version "$env:RUNNER_TEMP/portable-reference"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/seed-sdk-binary.ps1 -Version $version
      - name: Execute actual installation, product updater and installed activity checks
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.HPS_ACCEPTANCE_ANTHROPIC_API_KEY }}
          HPS_SERVICE_SOURCE: ${{ github.workspace }}/.service-source
          HPS_ACCEPTANCE_ISSUER: ${{ secrets.HPS_ACCEPTANCE_ISSUER }}
          HPS_INSTALLED_PORTABLE_REFERENCE: ${{ runner.temp }}/portable-reference
          TARGET: ${{ matrix.target }}
          HPS_VERIFICATION_CONTEXT: ${{ runner.temp }}/verification-context.json
        run: |
          node --experimental-strip-types scripts/release/cloud-executor/installed-runner.mjs \
            "$RUNNER_TEMP/managed-assets/collection.json" "$RUNNER_TEMP/managed-assets/previous" \
            "$RUNNER_TEMP/managed-assets" "$RUNNER_TEMP/installed-evidence" "$TARGET"
      - name: Require current artifact storage reservation
        id: artifact-budget-3
        if: always()
        shell: bash
        env:
          HPS_ENGINE_ARTIFACT_NAME: installed-${{ matrix.target }}
          HPS_ENGINE_IDENTITY_FILE: ${{ runner.temp }}/managed-assets/collection.json
        run: node scripts/release/cloud-executor/workflow-gate.mjs authorize installed-managed:artifact-store artifact-store
      - name: Preserve installed evidence including failed and blocked checks
        id: evidence-artifact
        if: always() && steps.artifact-budget-3.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: installed-${{ matrix.target }}
          path: ${{ runner.temp }}/installed-evidence/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Reconcile immutable stored artifact using fresh workflow identity
        if: always() && steps.evidence-artifact.outcome == 'success'
        shell: bash
        env:
          HPS_ENGINE_ARTIFACT_NAME: installed-${{ matrix.target }}
          HPS_ENGINE_IDENTITY_FILE: ${{ runner.temp }}/managed-assets/collection.json
          HPS_ENGINE_ARTIFACT_ID: ${{ steps.evidence-artifact.outputs.artifact-id }}
        run: node scripts/release/cloud-executor/workflow-gate.mjs complete installed-managed:artifact-store artifact-store
      - name: Require current artifact storage reservation
        id: artifact-budget-4
        if: always()
        shell: bash
        env:
          HPS_ENGINE_ARTIFACT_NAME: installed-diagnostics-${{ matrix.target }}
          HPS_ENGINE_IDENTITY_FILE: ${{ runner.temp }}/managed-assets/collection.json
        run: node scripts/release/cloud-executor/workflow-gate.mjs authorize installed-managed:artifact-store artifact-store
      - name: Preserve separate native diagnostics and screenshots
        id: stored-artifact-4
        if: always() && steps.artifact-budget-4.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: installed-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/installed-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Reconcile immutable stored artifact using fresh workflow identity
        if: always() && steps.stored-artifact-4.outcome == 'success'
        shell: bash
        env:
          HPS_ENGINE_ARTIFACT_NAME: installed-diagnostics-${{ matrix.target }}
          HPS_ENGINE_IDENTITY_FILE: ${{ runner.temp }}/managed-assets/collection.json
          HPS_ENGINE_ARTIFACT_ID: ${{ steps.stored-artifact-4.outputs.artifact-id }}
        run: node scripts/release/cloud-executor/workflow-gate.mjs complete installed-managed:artifact-store artifact-store
      - name: Submit observed reports using protected workflow OIDC
        if: always() && steps.context.outcome == 'success'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          HPS_EVIDENCE_ARTIFACT_ID: ${{ steps.evidence-artifact.outputs.artifact-id }}
        run: |
          node scripts/release/cloud-executor/evidence-client.mjs submit \
            "$RUNNER_TEMP/installed-evidence/installed-reports.json" "$RUNNER_TEMP/verification-context.json" "$TARGET"
  acceptance:
    needs: candidate
    if: needs.candidate.outputs.published != 'true' && needs.candidate.outputs.managed != 'true'
    strategy:
      fail-fast: false
      # One session key per cohort: each OS run opens and closes the synthetic
      # acceptance session (#1404), so the two must not overlap.
      max-parallel: 1
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - name: Require live acceptance credential
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.HPS_ACCEPTANCE_ANTHROPIC_API_KEY }}
        run: test -n "$ANTHROPIC_API_KEY" || { echo 'BLOCKED missing acceptance credential'; exit 1; }
      - name: Bootstrap pinned private Service packages
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix e2e
      - name: Resolve pinned Service source
        id: service
        shell: bash
        run: echo "sha=$(node -p "require('./config/service-deployment.json').sha")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hypeproof/hypeproof-service
          ref: ${{ steps.service.outputs.sha }}
          token: ${{ secrets.HYPEPROOF_READ_TOKEN }}
          path: .service-source
      - name: Install candidate Service dependencies
        working-directory: .service-source
        run: npm run setup:packages -- worker
      - name: Download untouched candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-assets" "$RUNNER_TEMP/candidate-app" "$RUNNER_TEMP/unified-evidence"
          gh release download "$TAG" --dir "$RUNNER_TEMP/candidate-assets"
      - name: Extract Mac package
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -xk "$RUNNER_TEMP/candidate-assets/HypeProof-Studio-darwin-arm64.zip" "$RUNNER_TEMP/candidate-app"
      - name: Extract Windows package and verify installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = @(Get-ChildItem "$env:RUNNER_TEMP/candidate-assets/*win32-x64*.zip")
          if ($asset.Count -ne 1) { throw 'Expected one Windows package' }
          Expand-Archive -LiteralPath $asset[0].FullName -DestinationPath "$env:RUNNER_TEMP/candidate-app"
          node e2e/unified-release/install-windows.mjs "$env:RUNNER_TEMP/candidate-assets" "$env:RUNNER_TEMP/candidate-app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # jayleekr/hypeprooflab#997: same per-machine SDK binary precondition as
      # verify-service-activities.yml; run.mjs refuses to start without it.
      - name: Seed the Agent SDK binary the candidate expects
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/seed-sdk-binary.sh --version "$(node e2e/unified-release/sdk-seed.mjs version "$RUNNER_TEMP/candidate-app/HypeProof Studio.app")"
      - name: Seed the Agent SDK binary the candidate expects
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node e2e/unified-release/sdk-seed.mjs version "$env:RUNNER_TEMP/candidate-app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/seed-sdk-binary.ps1 -Version $version
      - name: Both activities in the shipped App
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.HPS_ACCEPTANCE_ANTHROPIC_API_KEY }}
          HPS_SERVICE_SOURCE: ${{ github.workspace }}/.service-source
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/candidate-app"
          if [[ "$RUNNER_OS" == macOS ]]; then app="$app/HypeProof Studio.app"; fi
          node e2e/unified-release/run.mjs "$app" "$RUNNER_TEMP/candidate-assets" "$RUNNER_TEMP/unified-evidence" "$SOURCE_SHA" "${TAG#v}"
      - name: Candidate App against the current public Service
        shell: bash
        env:
          # #1404 — per-run synthetic codes and a short session on the synthetic
          # acceptance cohort. The scoped issuer is preferred; the admin secret
          # the publish job's freeze already uses is the fallback, so no new
          # long-lived secret is required. public.mjs strips all of these from
          # the App's environment.
          HPS_ACCEPTANCE_ISSUER: ${{ secrets.HPS_ACCEPTANCE_ISSUER }}
          HPS_ADMIN_PASSWORD: ${{ secrets.HPS_ADMIN_PASSWORD }}
          # Pre-#1404 static codes: read only when neither credential is set.
          HPS_ACCEPTANCE_TRIAL_CODE: ${{ secrets.HPS_ACCEPTANCE_TRIAL_CODE }}
          HPS_ACCEPTANCE_CLASSROOM_CODE: ${{ secrets.HPS_ACCEPTANCE_CLASSROOM_CODE }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/candidate-app"
          if [[ "$RUNNER_OS" == macOS ]]; then app="$app/HypeProof Studio.app"; fi
          node e2e/unified-release/public.mjs "$app" "$RUNNER_TEMP/unified-evidence/public" "$SOURCE_SHA" "${TAG#v}"
      - name: Require current artifact storage reservation
        id: artifact-budget-5
        if: always()
        shell: bash
        env:
          HPS_ENGINE_ARTIFACT_NAME: unified-${{ matrix.platform }}
        run: node scripts/release/cloud-executor/workflow-gate.mjs authorize acceptance:artifact-store artifact-store
      - name: Upload synthetic acceptance evidence
        id: stored-artifact-5
        if: always() && steps.artifact-budget-5.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unified-${{ matrix.platform }}
          path: ${{ runner.temp }}/unified-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Reconcile immutable stored artifact using fresh workflow identity
        if: always() && steps.stored-artifact-5.outcome == 'success'
        shell: bash
        env:
          HPS_ENGINE_ARTIFACT_NAME: unified-${{ matrix.platform }}
          HPS_ENGINE_ARTIFACT_ID: ${{ steps.stored-artifact-5.outputs.artifact-id }}
        run: node scripts/release/cloud-executor/workflow-gate.mjs complete acceptance:artifact-store artifact-store
  publish:
    needs: [candidate, acceptance]
    if: needs.candidate.outputs.published != 'true' && needs.candidate.outputs.managed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - uses: actions/download-artifact@v4
        with:
          pattern: unified-*
          path: receipts
      - name: Verify current asset bytes against both acceptance receipts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$TAG" --dir dist
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipts=['darwin-arm64','win32-x64'].map(os=>JSON.parse(fs.readFileSync('receipts/unified-'+os+'/receipt.json','utf8')));
          fs.writeFileSync('dist/unified-acceptance.json',JSON.stringify({schema:'hps-unified-release/1',receipts},null,2));
          NODE
          node scripts/check-unified-release.mjs dist "$SOURCE_SHA" "${TAG#v}"
      - name: Confirm the public Service still matches acceptance
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected=JSON.parse(fs.readFileSync('dist/unified-acceptance.json','utf8')).receipts[0].publicService;
          const response=await fetch(expected.base+'/health',{signal:AbortSignal.timeout(15000)});
          if(!response.ok||(await response.json()).version!==expected.version)throw Error('Public Service changed; rerun acceptance');
          NODE
      - name: Live-session freeze immediately before publication
        env:
          HPS_ADMIN_PASSWORD: ${{ secrets.HPS_ADMIN_PASSWORD }}
          HPS_FREEZE_OVERRIDE: ${{ inputs.override_live_session }}
          HPS_FREEZE_CONTEXT: Unified Studio accepted candidate publication
          TAG: ${{ inputs.tag }}
        run: bash scripts/release-freeze-gate.sh "refs/tags/$TAG"
      # A tag can be pushed by anyone with write access (no tag protection on this plan).
      # A stable tag is published only with an approved release PR or as a hotfix; otherwise
      # the release stays a draft. Rerun this workflow after the approval to publish it.
      - name: Publish gate — approved release PR or hotfix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: node scripts/release/publish-gate.mjs --tag "$TAG"
      - name: Publish and dispatch the public mirror
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft --jq .isDraft | grep -qx true
          node scripts/release/cloud-executor/workflow-gate.mjs legacy-only verify-unified:publish acceptance-upload
          gh release upload "$TAG" dist/unified-acceptance.json --clobber
          node scripts/release/cloud-executor/workflow-gate.mjs legacy-only verify-unified:publish release-publish
          gh release edit "$TAG" --draft=false
          node scripts/release/cloud-executor/workflow-gate.mjs legacy-only verify-unified:mirror-dispatch mirror-dispatch
          gh workflow run mirror-release.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG" -f dry_run=false
  managed-verification-complete:
    needs: [candidate, collect-managed, installed-managed]
    if: needs.candidate.outputs.managed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Verification recorded; manager approval remains separate
        run: echo 'Observed evidence submitted. The server driver waits for terminal metering and fresh manager approval before same-byte publication.'
