name: dental-reference
on:
  pull_request:
    paths:
      - 'docs/curriculum/dental-ownership/**'
      - 'e2e/dental-reference/**'
      - 'e2e/preview-viewport/**'
      - 'e2e/reference-design/**'
      - 'e2e/image-edit/**'
      - 'extensions/hypeproof-chat/src/referenceDesign.ts'
      - 'extensions/hypeproof-chat/src/imageEditAssets.ts'
      - 'extensions/hypeproof-chat/test/fixtures/reference-design/**'
      - 'extensions/hypeproof-chat/test/fixtures/image-edit/**'
      - 'extensions/hypeproof-chat/src/liveServerHelpers.ts'
      - 'extensions/hypeproof-chat/src/nativeBrowser.ts'
      - 'e2e/chalk-authoring/**'
      - 'e2e/classroom/**'
      - 'chalk/**'
      - 'e2e/package*.json'
      - '.github/workflows/dental-reference.yml'
permissions:
  contents: read

# Pull request only: a newer push replaces the run in progress.
concurrency:
  group: dental-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Bootstrap pinned private Service packages
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm ci
        working-directory: chalk
      - run: npm run test:chalk-authoring
        working-directory: e2e
      - run: npm run test:classroom
        working-directory: e2e
      - run: npm run test:preview-viewport
        working-directory: e2e
      - run: npm run test:dental-reference
        working-directory: e2e
      - run: npm run test:reference-design
        working-directory: e2e
      - run: npm run test:image-edit
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dental-reference-evidence
          path: |
            e2e/test-results/dental-reference/
            e2e/test-results/chalk-authoring/
            e2e/test-results/classroom/
            e2e/artifacts/reference-design/
            e2e/artifacts/image-edit-comparison/
          retention-days: 14
