# Mac arm64 build — CI counterpart of build-windows.yml.
# Goal: a `git tag v*` produces the Mac Release asset with zero human build.
#
# Deviations from build-windows.yml (intentional):
#   - env is provisioned from hypeproof-studio.env.example: the real
#     hypeproof-studio.env is gitignored, so it is never in a CI checkout.
#     The .example is the complete, secret-free branding/build config.
#   - submodules: recursive — vscodium-base is a submodule the build needs
#     (build-windows.yml omits this; tracked as a separate follow-up).
#   - on a tag push, the .app is zipped to HypeProof-Studio-darwin-arm64.zip
#     (name matches scripts/install-mac.sh ASSET_SUFFIX) and published to the
#     GitHub Release, so the operator one-liner resolves it.
#
# Two build paths, chosen per run in "Choose build path" (2026-10-19):
#   - repack (minutes): the base inputs (scripts/mac-base-key.sh) match a cached
#     base app or a published release. Only the hypeproof-chat extension is
#     rebuilt and swapped in (scripts/repack-mac.sh).
#   - full (1–2 h): base inputs changed, nothing to reuse, or full_build=true.
#     Saves the unsigned base app to the Actions cache for later repacks.
# Both paths then share the same stamp → sign → verify → package → upload steps.
name: Build macOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (default: workflow ref; release-cut passes the full candidate SHA)"
        required: false
        default: ""
      candidate_sha:
        description: "Expected full candidate SHA; must equal ref, checkout and publication tag"
        required: false
        default: ""
      managed_draft:
        description: "Build final-version bytes into an RC draft; stop before acceptance and publication"
        type: boolean
        default: false
      release_version:
        description: "Managed draft only: final vX.Y.Z matching the workflow's vX.Y.Z-rc.N tag"
        required: false
        default: ""
      # dag.yaml task D / #676. Only meaningful when dispatching against a
      # stable TAG ref (`gh workflow run build-mac.yml --ref v0.1.20`), which
      # is the one dispatch shape that actually publishes a Release. On the
      # `push: tags` path below this context is empty, i.e. never overridden
      # by default — an operator who really must ship a stable build over a
      # live class has to come back and dispatch it deliberately.
      override_live_session:
        description: "Publish even if a class is live (stable tag refs only; recorded in the job summary)"
        type: boolean
        default: false
      full_build:
        description: "Force the full 1–2 h VS Code build even when a reusable base app exists"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write # create/upload the GitHub Release on tag builds
  actions: write # dispatch mirror-release.yml after a tag build (see below)

concurrency:
  group: build-mac-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false # never cancel an in-flight release build

jobs:
  build-mac:
    runs-on: macos-15 # arm64 on GitHub-hosted macos-14+
    timeout-minutes: 180 # full build is 1–2 h; headroom under the 6 h cap

    env:
      OS_NAME: osx
      VSCODE_ARCH: arm64
      # Required by get_repo.sh + prepare_vscode.sh. Missing → exit 56 at
      # "Retrieve lastest version" (malformed update.code.visualstudio.com URL).
      # hypeproof-studio.env.example:32 declares these but "Load HypeProof env"
      # step only propagates HPS_* / APP_*, not these.
      VSCODE_QUALITY: stable
      CI_BUILD: "no"
      SHOULD_BUILD: "yes"
      SHOULD_BUILD_REH: "no"
      SHOULD_BUILD_REH_WEB: "no"
      DISABLE_UPDATE: "yes"
      VSCODE_PUBLISH_COUNTER: 0
      NODE_OPTIONS: "--max-old-space-size=12288"
      # GitHub-hosted macos-15 arm64 runners currently expose about 40 GB free
      # after checkout + source prep. Full local builds still use the stricter
      # scripts/check-env.sh default.
      HPS_MIN_FREE_GB: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || inputs.ref || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          # ~/.npm for the extension, webview-ui and dist/vendor installs.
          cache: npm
          cache-dependency-path: |
            extensions/hypeproof-chat/package-lock.json
            extensions/hypeproof-chat/webview-ui/package-lock.json

      - name: Verify candidate and resolve build identity
        id: contract
        shell: bash
        env:
          HPS_BUILD_REF: ${{ inputs.ref }}
          HPS_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          HPS_MANAGED_DRAFT: ${{ inputs.managed_draft }}
          HPS_RELEASE_VERSION: ${{ inputs.release_version }}
        run: node scripts/release/build-contract.mjs preflight "$RUNNER_TEMP/hps-build-contract.json"

      # dag.yaml task D (#676) — live-class release freeze, fail-fast half.
      #
      # A stable `v*` tag publishes a non-prerelease Release, which the in-app
      # update checker turns into a banner and mirror-release.yml propagates.
      # Telling a room of participants to reinstall mid-class is the same
      # failure #668 was: an interruption they did not ask for.
      #
      # `-rc` tags are EXEMPT. Task A made them prereleases, which the updater
      # skips and /releases/latest excludes — they reach nobody by design, so
      # freezing them buys nothing and would kill the dev channel during
      # exactly the hours it is most needed. release-freeze-gate.sh reuses
      # task A's scripts/tag-is-prerelease.sh for that call rather than
      # re-deriving it.
      #
      # This copy runs before the 1–2 h build so a frozen release fails in
      # seconds instead of burning two hours of macOS runner. The copy that
      # actually protects the class is the pre-publish one further down — a
      # class can start while the build is running.
      - name: Live-session release freeze — pre-build (#676)
        shell: bash
        env:
          HPS_ADMIN_PASSWORD: ${{ secrets.HPS_ADMIN_PASSWORD }}
          HPS_FREEZE_OVERRIDE: ${{ inputs.override_live_session }}
          HPS_FREEZE_CONTEXT: >-
            macOS build of ${{ github.ref_name }} @ ${{ github.sha }} (pre-build gate)
        run: bash scripts/release-freeze-gate.sh "$GITHUB_REF"

      # ── Fast path selection ────────────────────────────────────────────────
      # The base app (everything except extensions/hypeproof-chat) depends only
      # on the inputs hashed by scripts/mac-base-key.sh. Same key → reuse.
      - name: Resolve Mac base key
        id: basekey
        shell: bash
        run: echo "key=$(bash scripts/mac-base-key.sh HEAD)" >> "$GITHUB_OUTPUT"

      # Restores into the exact place the full build leaves its output, so every
      # later step reads the same path in both modes. Actions caches are scoped:
      # a tag run sees caches saved on that tag or on the default branch only, so
      # seed it from main (docs/dev/fast-mac-release.md). The release download in
      # the next step covers the unseeded case.
      - name: Restore cached base app
        id: basecache
        if: inputs.full_build != true
        uses: actions/cache/restore@v4
        with:
          path: vscodium-base/VSCode-darwin-arm64
          key: ${{ steps.basekey.outputs.key }}

      - name: Choose build path (repack when the base is reusable)
        id: path
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_BUILD: ${{ inputs.full_build }}
          CACHE_HIT: ${{ steps.basecache.outputs.cache-hit }}
          BASE_KEY: ${{ steps.basekey.outputs.key }}
        run: |
          set -euo pipefail
          mode=full; source=none; base=""
          if [[ "$FULL_BUILD" == true ]]; then
            source=forced
          elif [[ "$CACHE_HIT" == true ]]; then
            mode=repack; source="actions-cache"; base="vscodium-base/VSCode-darwin-arm64/HypeProof Studio.app"
          elif found="$(bash scripts/find-mac-base-release.sh "$BASE_KEY")"; then
            tag="${found%% *}"; url="${found#* }"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/base-darwin-arm64.zip" "$url"
            mode=repack; source="release $tag"; base="$RUNNER_TEMP/base-darwin-arm64.zip"
          fi
          {
            echo "mode=$mode"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### macOS build path: $mode"
            echo "- base key: \`$BASE_KEY\`"
            echo "- base source: $source"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "build path: $mode (base: $source, key $BASE_KEY)"

      - name: Setup Python 3.11
        if: steps.path.outputs.mode == 'full'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free macOS runner disk
        if: steps.path.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          sudo rm -rf "$HOME/Library/Android" || true
          brew cleanup -s || true
          df -h /

      - name: Install build deps (libicns / icoutils / gnu-sed / jq / imagemagick / librsvg)
        if: steps.path.outputs.mode == 'full'
        run: |
          brew install libicns icoutils gnu-sed jq imagemagick librsvg || true
          icns2png --version || true
          gsed --version | head -1 || true
          composite -version | head -1 || true
          rsvg-convert --version || true

      - name: Provision build env (from gitignored .env's committed example)
        if: steps.path.outputs.mode == 'full'
        run: cp hypeproof-studio.env.example hypeproof-studio.env

      - name: Load HypeProof env
        if: steps.path.outputs.mode == 'full'
        shell: bash
        run: |
          # shellcheck source=/dev/null
          source ./hypeproof-studio.env
          # Re-export to GITHUB_ENV so subsequent steps see them
          {
            echo "APP_NAME=$APP_NAME"
            echo "APP_NAME_LC=$APP_NAME_LC"
            echo "BINARY_NAME=$BINARY_NAME"
            echo "ORG_NAME=$ORG_NAME"
            echo "ASSETS_REPOSITORY=$ASSETS_REPOSITORY"
            echo "GH_REPO_PATH=$GH_REPO_PATH"
            echo "HPS_NAME_SHORT=$HPS_NAME_SHORT"
            echo "HPS_NAME_LONG=$HPS_NAME_LONG"
            echo "HPS_APPLICATION_NAME=$HPS_APPLICATION_NAME"
            echo "HPS_DATA_FOLDER_NAME=$HPS_DATA_FOLDER_NAME"
            echo "HPS_DARWIN_BUNDLE_ID=$HPS_DARWIN_BUNDLE_ID"
            echo "HPS_URL_PROTOCOL=$HPS_URL_PROTOCOL"
            # Win32 names — needed even for Mac build because
            # scripts/apply-product-overrides.sh bakes them into the shared
            # product.json (cross-platform), not just for Windows builds.
            echo "HPS_WIN32_DIR_NAME=$HPS_WIN32_DIR_NAME"
            echo "HPS_WIN32_NAME_VERSION=$HPS_WIN32_NAME_VERSION"
            echo "HPS_WIN32_MUTEX_NAME=$HPS_WIN32_MUTEX_NAME"
            echo "HPS_WIN32_APP_USER_MODEL_ID=$HPS_WIN32_APP_USER_MODEL_ID"
            echo "HPS_WIN32_REG_VALUE_NAME=$HPS_WIN32_REG_VALUE_NAME"
          } >> "$GITHUB_ENV"

      - name: Install brand assets
        if: steps.path.outputs.mode == 'full'
        shell: bash
        run: bash scripts/install-brand-assets.sh

      - name: Build icons
        if: steps.path.outputs.mode == 'full'
        shell: bash
        working-directory: vscodium-base
        run: bash icons/build_icons.sh

      - name: Bootstrap pinned private Service packages
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs

      # Both paths. With setup-node's npm cache these are restores, not downloads;
      # inject-builtin-extensions.sh then skips its own npm install.
      - name: Install extension dependencies (npm ci)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefix extensions/hypeproof-chat
          npm ci --no-audit --no-fund --prefix extensions/hypeproof-chat/webview-ui

      - name: Fetch + prepare VS Code source
        if: steps.path.outputs.mode == 'full'
        shell: bash
        working-directory: vscodium-base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash get_repo.sh
          bash prepare_src.sh
          bash ../scripts/stage-core-patches.sh
          bash prepare_vscode.sh

      - name: Apply product.json overrides
        if: steps.path.outputs.mode == 'full'
        shell: bash
        working-directory: vscodium-base
        run: bash ../scripts/apply-product-overrides.sh

      - name: Inject hypeproof-chat
        if: steps.path.outputs.mode == 'full'
        shell: bash
        run: bash scripts/inject-builtin-extensions.sh

      - name: Build (macOS)
        if: steps.path.outputs.mode == 'full'
        shell: bash
        # Use the canonical entry point (build-pipeline.md): scripts/run-build.sh.
        # Direct `bash build.sh` skips the .yet restore + vscode/ reset that
        # run-build.sh handles. CI hit that gap at v0.1.8 (build.sh:11 sources
        # prepare_vscode.sh, whose mv .yet→.patch failed on second run).
        # No working-directory: run-build.sh cd's into vscodium-base itself.
        # No logfile arg: keep output in the GH Actions step log.
        env:
          # vscode-min-prepack fetches the bundled MS debug extensions
          # (vscode-js-debug etc.) from api.github.com. Unauthenticated those
          # hit the 60/hr shared-runner rate limit → 403 (flaky: v0.1.14 failed,
          # v0.1.15 passed by luck). Passing the token raises it to 1000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/run-build.sh

      # Unsigned, unstamped base app for future repacks. Saved before any
      # per-release step mutates it. On a tag ref the entry is visible to that
      # tag only; on main it serves every later tag.
      - name: Save base app to cache
        if: steps.path.outputs.mode == 'full'
        uses: actions/cache/save@v4
        with:
          path: vscodium-base/VSCode-darwin-arm64
          key: ${{ steps.basekey.outputs.key }}

      - name: Repack extension into the reused base app
        if: steps.path.outputs.mode == 'repack'
        shell: bash
        env:
          HPS_REPACK_BASE: ${{ steps.path.outputs.base }}
        run: bash scripts/repack-mac.sh --base "$HPS_REPACK_BASE"

      # Stamp CFBundleShortVersionString on the built .app (#361). Must run
      # BEFORE Re-sign: apply-product-overrides.sh no longer stamps
      # vscode/package.json .version (that feeds the runtime vscode.version API
      # and 0.1.x broke json-language-features), so the .app's Info.plist would
      # otherwise carry the raw VS Code version. Stamping here — before the
      # ad-hoc re-seal — means the seal covers the stamped plist and sign-mac's
      # codesign --verify gate stays valid. (Stamping AFTER Re-sign would break
      # the seal that #311 fixed, re-triggering "손상되어 열 수 없습니다".)
      - name: Stamp product version on Info.plist + product.json (#361)
        shell: bash
        # Both paths (scripts/repack-mac.sh already ran it; it is idempotent).
        # The logic lives in scripts/stamp-mac-app.sh so the two paths cannot drift.
        run: bash scripts/stamp-mac-app.sh

      # Our build modifies the bundle after Electron signed it (extension injection +
      # product.json rewrite), which breaks the seal. A *malformed* signature makes
      # macOS say "손상되었기 때문에 열 수 없습니다 — 휴지통으로 이동" with NO
      # "Open Anyway" escape hatch, so a downloaded release is unopenable. Re-sealing
      # ad-hoc (free, no certificate) turns that dead end into the recoverable
      # "unidentified developer" prompt. Also hard-fails the build if the seal is
      # still invalid, so a broken-signature artifact can never be released again.
      # Stable signing identity (optional). Ad-hoc signatures are derived from
      # bundle contents, so EVERY build gets a different code identity. macOS
      # binds a keychain "Always Allow" grant to that identity, which is why the
      # "HypeProof Studio wants to use your confidential information" dialog
      # returns after every update: the extension stores the workshop token in
      # SecretStorage → Electron safeStorage → keychain, and the new build is a
      # stranger to the old grant.
      #
      # Importing one certificate and reusing it across releases fixes that: the
      # identity stops changing, so the grant survives updates. Absent the
      # secrets this step no-ops and sign-mac.sh falls back to ad-hoc — the PR is
      # safe to merge before the secrets exist.
      #
      # The certificate can be self-signed (free; fixes the keychain prompt only)
      # or a Developer ID (also removes the Gatekeeper "unidentified developer"
      # step + enables notarization). Swapping one for the other is a secret
      # change, not a workflow change.
      # No `if:` guard — step-level `env` is not visible to `if`, and `secrets`
      # in `if` is a footgun. The emptiness check lives in the script instead, so
      # the step is a documented no-op until the secrets exist.
      # NOT optional despite the historical name: this step exits 1 when a
      # cert IS configured and unusable, which fails the whole release
      # build. It is a documented no-op only when MACOS_CERT_P12 is unset.
      - name: Import signing certificate (no-op when unconfigured)
        id: signcert
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "MACOS_CERT_P12 not set — skipping; sign-mac.sh will use ad-hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/hps-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "${MACOS_CERT_PASSWORD:-}" -T /usr/bin/codesign -A
          # Without this, codesign blocks on an interactive "allow access?" that
          # a headless runner can never answer.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Prepend to the search list so codesign finds the identity, keeping
          # the runner's existing keychains (login/System) usable.
          EXISTING="$(security list-keychains -d user | sed 's/[[:space:]]*"//g')"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          rm -f "$RUNNER_TEMP/cert.p12"
          # Print the identity list BEFORE selecting from it. The previous
          # version captured find-identity into $(...) and threw the output
          # away, so three failed release builds reported only "no codesigning
          # identity found" and nothing about why. This one line names the
          # reason (e.g. CSSMERR_TP_NOT_TRUSTED) in the log.
          echo "--- identities in $KEYCHAIN ---"
          security find-identity -p codesigning "$KEYCHAIN" || true
          echo "-------------------------------"

          # Select by SHA-1 hash, and deliberately WITHOUT `-v`.
          #
          # `-v` lists only identities whose chain validates. The cert #619
          # loaded is SELF-SIGNED (see that PR: self-sign now, Developer ID
          # later), and a self-signed cert's trust lives in the keychain's
          # trust settings -- NOT inside the .p12. So the trust never travels
          # to CI, find-identity -v returns nothing, and the step fails. It
          # failed on its first-ever execution (rc.1) and had never run before
          # that: 8716a28 added it seven hours after the last successful mac
          # build, so there was no regression, only a step that never worked.
          #
          # codesign signs happily with an untrusted identity when it is named
          # by hash, which is all #619 needs -- a STABLE identity so the
          # keychain grant survives updates. Gatekeeper stays unsatisfied
          # either way until notarization (#620); trust here buys nothing.
          #
          # When this is swapped for a real Developer ID cert, `-v` can come
          # back -- but then the chain needs the Apple intermediate, which the
          # runner images do not reliably preinstall
          # (actions/runner-images#9167). Import it into $KEYCHAIN first:
          #   curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
          #     -o "$RUNNER_TEMP/di.cer" && security import "$RUNNER_TEMP/di.cer" -k "$KEYCHAIN"
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" \
            | awk '/^ *[0-9]+\)/{print $2; exit}')"
          [ -n "$IDENTITY" ] || {
            echo "::error::no codesigning identity in the keychain -- see the list above for the reason"
            exit 1
          }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Signing identity ready: $IDENTITY"

      - name: Re-sign .app + verify
        shell: bash
        env:
          # Empty → sign-mac.sh falls back to ad-hoc (its documented default).
          CODESIGN_IDENTITY: ${{ steps.signcert.outputs.identity || '-' }}
        run: bash scripts/sign-mac.sh

      # Post-build gate (build-pipeline.md says mandatory; was missing from CI
      # until #349). REQUIRE_SDK_VENDOR=1: a build whose injected extension is
      # missing the dist/vendor SDK tree fails here instead of shipping a
      # silently proxy-only coach (#343). The data-folder check is a warn-only
      # (needs a first launch, which CI never does), so no skip knob is needed.
      - name: Verify branding + vendored SDK
        shell: bash
        env:
          REQUIRE_SDK_VENDOR: "1"
        run: bash scripts/verify-branding.sh

      - name: Package .app → darwin-arm64 zip
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT_DIR="vscodium-base/VSCode-darwin-arm64"
          [ -d "$OUT_DIR" ] || { echo "::error::$OUT_DIR not found"; ls -la vscodium-base || true; exit 1; }
          APP="$(cd "$OUT_DIR" && ls -d *.app | head -1)"
          [ -n "$APP" ] || { echo "::error::no .app in $OUT_DIR"; ls -la "$OUT_DIR"; exit 1; }
          # Version stamp happened in the pre-sign "Stamp product version" step
          # (#361) so the ad-hoc seal covers it — do NOT stamp here.
          ( cd "$OUT_DIR" && zip -ry "$GITHUB_WORKSPACE/dist/HypeProof-Studio-darwin-arm64.zip" "$APP" )
          ls -la dist

      - name: Record managed draft artifact identity
        if: steps.contract.outputs.managed_draft == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Read the archive that will be uploaded, not a mutable pre-package tree.
          unzip -q dist/HypeProof-Studio-darwin-arm64.zip -d "$RUNNER_TEMP/hps-draft-artifact"
          node scripts/release/build-contract.mjs record "$RUNNER_TEMP/hps-build-contract.json" \
            darwin-arm64 dist "$RUNNER_TEMP/hps-draft-artifact/HypeProof Studio.app"

      - name: Upload artifact (debugging / workflow_dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: hypeproof-studio-darwin-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # dag.yaml task D (#676) — the half that actually protects the class.
      #
      # The pre-build copy above only proves no class was running 1–2 h ago.
      # This is the last moment before participants see anything: the next
      # step publishes the Release (update banner) and the one after that
      # dispatches the mirror. Re-ask here.
      #
      # A block here is not wasted work — the .app is already in the workflow
      # artifact above, so after class the operator re-dispatches against the
      # same tag ref and only the publish repeats.
      - name: Live-session release freeze — pre-publish (#676)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          HPS_ADMIN_PASSWORD: ${{ secrets.HPS_ADMIN_PASSWORD }}
          HPS_FREEZE_OVERRIDE: ${{ inputs.override_live_session }}
          HPS_FREEZE_CONTEXT: >-
            macOS release ${{ github.ref_name }} @ ${{ github.sha }} (pre-publish gate)
        run: bash scripts/release-freeze-gate.sh "$GITHUB_REF"

      - name: Upload draft candidate (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HPS_MANAGED_DRAFT: ${{ steps.contract.outputs.managed_draft }}
        run: |
          set -euo pipefail
          if [[ "$HPS_MANAGED_DRAFT" == true ]]; then
            node scripts/release/build-contract.mjs check-upload "$RUNNER_TEMP/hps-build-contract.json" \
              darwin-arm64 dist "$RUNNER_TEMP/hps-draft-artifact/HypeProof Studio.app"
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          PRERELEASE_FLAG="$(bash scripts/tag-is-prerelease.sh "$TAG")"
          shopt -s nullglob
          assets=(dist/*.zip dist/*.exe)
          (( ${#assets[@]} > 0 )) || exit 1
          if [[ "$HPS_MANAGED_DRAFT" == true ]]; then assets+=(dist/draft-build-darwin-arm64.json); fi
          node scripts/release/release-draft.mjs --tag "$TAG" $PRERELEASE_FLAG "${assets[@]}"

      # workflow_dispatch is explicit because GITHUB_TOKEN release events do
      # not trigger another workflow. Both builders dispatch; concurrency serializes.
      - name: Trigger both-activity release acceptance
        if: steps.contract.outputs.auto_acceptance == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run verify-unified-release.yml --repo "$GITHUB_REPOSITORY" \
            -f tag="${GITHUB_REF#refs/tags/}"
