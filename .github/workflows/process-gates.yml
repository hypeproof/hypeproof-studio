name: process

# Delivery-process rules as PR checks (#3429). PRs are merged by a bot with no human
# reviewer, so a rule that only "the reviewer" enforces never runs.
# Re-runs when the body or labels change: the escape hatch is a label plus a body line.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: process-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  escaped-bug-case:
    # Name is load-bearing: hypeproof-harness loop/gates/required_checks.yaml lists it.
    name: process / escaped-bug-case
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/release
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      # README "유출 버그 규칙": a PR closing an escaped-bug (or member-report + bug) issue adds or
      # changes a cases.yaml case naming the PR or the issue, or one whose automated_by is a test it adds.
      - name: Escaped-bug fix carries a release-casebook case
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/release/escaped-bug-case.mjs --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

  release-check:
    # Name is load-bearing: hypeproof-harness loop/gates/required_checks.yaml lists it once it is required.
    name: process / release-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The PR head tree supplies the contract and the Smoke check paths. The default branch is
      # fetched only for the hotfix lane, which is policy read from main (as hype-pr does).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            scripts/hype-pr
            config
      - name: Fetch the default branch for the hotfix lane
        run: git fetch --no-tags --depth=1 origin main
      # #3568: the Release check body contract, judged again on every PR body edit. Exemptions are
      # logged inside the script (dependabot, release bot branches, harness sync).
      - name: Release check contract
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/release/release-check-gate.py --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --checkout .
