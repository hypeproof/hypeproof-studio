name: companion-source
on:
  pull_request:
    paths:
      - 'apps/companion-android/**'
      - 'extensions/hypeproof-chat/**'
      - 'scripts/companion-ci.mjs'
      - 'scripts/bootstrap-service-packages.mjs'
      - 'scripts/test/companion-ci-input.test.mjs'
      - 'config/service-packages.json'
      - 'package*.json'
      - '.github/workflows/companion-source.yml'
  push:
    branches: [main]
    paths:
      - 'apps/companion-android/**'
      - 'extensions/hypeproof-chat/**'
      - 'scripts/companion-ci.mjs'
      - 'scripts/bootstrap-service-packages.mjs'
      - 'scripts/test/companion-ci-input.test.mjs'
      - 'config/service-packages.json'
      - 'package*.json'
      - '.github/workflows/companion-source.yml'
permissions:
  contents: read
concurrency:
  group: companion-source-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    name: companion / Android source + private client ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap verified private Service packages
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - run: npm ci
      - run: npm ci
        working-directory: extensions/hypeproof-chat
      - run: npm ci
        working-directory: extensions/hypeproof-chat/webview-ui
      - name: Required private client, Android source and in-memory browser build
        env:
          COMPANION_CI_OUTPUT: ${{ runner.temp }}/companion-ci
        run: node scripts/companion-ci.mjs
      - name: Source-check evidence (no private package or generated bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-source-evidence
          path: ${{ runner.temp }}/companion-ci
          if-no-files-found: ignore
