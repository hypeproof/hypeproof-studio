name: deploy-worker (verification only)

# The Service Worker (hypeproof-studio-api) is deployed by hypeproof/hypeproof-service
# with `npm run release:deploy` (worker/DEPLOY.md there). Service is the only deploy
# owner since 2026-10-19; schema migrations are applied by hypeproof-ops opsdb.py
# (hypeproof-ops#4). This workflow no longer deploys, migrates or publishes prices,
# and holds no Cloudflare credential. It keeps the checks that only Studio can run:
# the Service tests at the pinned Service SHA, the public-App activity compatibility
# run, and optional read-mostly production verification after a Service release.
# The file keeps its name because tests and docs refer to it.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Studio branch, tag, or SHA whose config/service-deployment.json pin to verify"
        required: false
        default: "main"
      run_activity_compatibility:
        description: "Run the public-App compatibility check against the pinned Service"
        type: boolean
        default: false
      verify_prod:
        description: "Run the production verification scripts (no deploy)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-worker-verification
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  activity-compatibility:
    needs: resolve
    if: ${{ inputs.run_activity_compatibility }}
    uses: ./.github/workflows/verify-service-activities.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    secrets:
      HPS_ACCEPTANCE_ANTHROPIC_API_KEY: ${{ secrets.HPS_ACCEPTANCE_ANTHROPIC_API_KEY }}
      HYPEPROOF_READ_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
  verify:
    needs: [resolve, activity-compatibility]
    if: ${{ always() && needs.resolve.result == 'success' && (!inputs.run_activity_compatibility || needs.activity-compatibility.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HPS_ADMIN_PASSWORD: ${{ secrets.HPS_ADMIN_PASSWORD }}
      HPS_OWNER_SERVICE_SECRET: ${{ secrets.HPS_OWNER_SERVICE_SECRET }}
      PROD: https://api.hypeproof-ai.xyz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Resolve pinned Service source
        id: service
        shell: bash
        run: echo "sha=$(node -p "require('./config/service-deployment.json').sha")" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Service source
        uses: actions/checkout@v4
        with:
          repository: hypeproof/hypeproof-service
          ref: ${{ steps.service.outputs.sha }}
          token: ${{ secrets.HYPEPROOF_READ_TOKEN }}
          path: .service-source

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .service-source/worker/package-lock.json

      - name: Install worker dependencies
        working-directory: .service-source
        run: npm run setup:packages -- worker

      - name: Worker smoke tests
        working-directory: .service-source/worker
        run: npm test

      - name: Worker typecheck
        working-directory: .service-source/worker
        run: npm run typecheck

      - name: Owner console smoke controls
        run: node scripts/test-owner-console.mjs

      - name: Verify production
        if: ${{ inputs.verify_prod }}
        run: bash scripts/verify-prod.sh

      - name: Verify Owner usage console (read-only)
        if: ${{ inputs.verify_prod }}
        run: node scripts/verify-owner-console.mjs

      # #406 — verify-prod.sh never makes a real model call (its chat layer
      # needs a TOKEN it has no way to mint), so a release could green-light a
      # gateway that 400s every agent-sdk turn. This step opens a short session
      # on the CANARY cohort (empty roster, console-hidden), replays the Agent
      # SDK's real request shape against the live upstream, and closes it again.
      # Skips itself when the admin secret is absent.
      - name: SDK request-shape contract (R7)
        if: ${{ inputs.verify_prod }}
        env:
          # Least-privilege credential: an issuer scoped to the canary cohort +
          # profile only. Falls back to the job-level HPS_ADMIN_PASSWORD when
          # absent, and skips (exit 0) when neither is configured — see #412.
          HPS_CANARY_ISSUER: ${{ secrets.HPS_CANARY_ISSUER }}
        run: bash scripts/run-sdk-contract.sh
