name: Private release installers
on:
  pull_request:
    paths:
      - 'scripts/install-win.ps1'
      - 'scripts/install.ps1'
      - 'scripts/tests/bootstrap-win-private-fixture.ps1'
      - 'scripts/tests/install-win-fixture.ps1'
      - 'scripts/tests/win-release-set.ps1'
      - 'scripts/tests/install-kit-fixture.ps1'
      - '.github/workflows/private-installers.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/install-win.ps1'
      - 'scripts/install.ps1'
      - 'scripts/tests/bootstrap-win-private-fixture.ps1'
      - 'scripts/tests/install-win-fixture.ps1'
      - 'scripts/tests/win-release-set.ps1'
      - 'scripts/tests/install-kit-fixture.ps1'
      - '.github/workflows/private-installers.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 authentication and integrity controls
        shell: pwsh
        run: |
          # Positive: latest has Windows; latest is macOS only (falls back past a
          # newer draft and prerelease); the fallback reads a second page; a pin.
          $positive = @('success', 'mac-only-latest', 'paged', 'pinned')
          $negative = @('auth-failed', 'bad-digest', 'bad-name', 'no-windows', 'pinned-mac-only')
          foreach ($scenario in $positive + $negative) {
            $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/install-win-fixture.ps1 -Scenario $scenario | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            if ($positive -contains $scenario -and $code -ne 0) { throw "Installer fixture failed: $scenario" }
            if ($negative -contains $scenario -and $code -eq 0) { throw "Negative control failed: $scenario" }
          }
          # No release has Windows: the error must say so, not a generic failure.
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/install-win-fixture.ps1 -Scenario no-windows | Out-String
          if ($out -notmatch 'has a Windows x64 installer yet') { throw 'no-windows did not report the missing Windows release' }
          exit 0
      - name: Windows PowerShell 5.1 private bootstrap functions
        shell: pwsh
        run: |
          $positive = @('success', 'mac-only-latest', 'paged', 'pinned', 'pinned-missing')
          $negative = @('auth-failed', 'bad-digest', 'bad-name', 'missing-digest', 'no-windows', 'pinned-mac-only')
          foreach ($scenario in $positive + $negative) {
            $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/bootstrap-win-private-fixture.ps1 -Scenario $scenario | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            if ($positive -contains $scenario -and $code -ne 0) { throw "Bootstrap fixture failed: $scenario" }
            if ($negative -contains $scenario -and $code -eq 0) { throw "Negative control failed: $scenario" }
            if ($scenario -eq 'no-windows' -and $out -notmatch 'has a Windows installer') { throw 'no-windows did not report the missing Windows release' }
          }
          exit 0
