# Release cut, dry-run only (#1608).
#
# Computes the range since the last stable v tag, runs smoke on the candidate and
# writes the release PR body (or the smoke-failure issue body) as an artifact.
# It creates no tag, PR or issue: permissions are read-only. Creating them, the
# approval gate and the weekly schedule are separate follow-ups.
name: release-cut

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate ref (default: main)"
        required: false
        default: "origin/main"
      since:
        description: "Trial only: treat the last main commit before this time as the baseline (e.g. '7 days ago')"
        required: false
        default: ""

permissions:
  contents: read
  checks: read
  pull-requests: read
  issues: read

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Controls
        run: node --test scripts/release/test/release-cut.test.mjs

      - name: Release cut (dry-run)
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
          SINCE: ${{ inputs.since }}
        run: |
          set +e
          args=(--out "$RUNNER_TEMP/release-cut" --candidate "$CANDIDATE")
          if [[ -n "$SINCE" ]]; then args+=(--since "$SINCE"); fi
          node scripts/release/release-cut.mjs "${args[@]}"
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          for f in release-pr.md smoke-failure-issue.md; do
            if [[ -f "$RUNNER_TEMP/release-cut/$f" ]]; then cat "$RUNNER_TEMP/release-cut/$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          # 0 PASS or skipped, 2 NOT_RUN: the dry-run itself succeeded. 1 is a smoke FAIL.
          if [[ $code -eq 1 ]]; then exit 1; fi
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-cut
          path: ${{ runner.temp }}/release-cut/
          if-no-files-found: warn
          retention-days: 14
