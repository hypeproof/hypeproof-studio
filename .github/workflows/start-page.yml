name: start-page
on:
  pull_request:
    paths:
      - 'assets/brand/**'
      - 'extensions/hypeproof-chat/**'
      - 'e2e/start-page/**'
      - 'e2e/trial-ux/**'
      - 'e2e/service-provenance.mjs'
      - 'e2e/voice-conversation/**'
      - 'e2e/sx/goal-browser.mjs'
      - 'e2e/package*.json'
      - '.github/workflows/start-page.yml'
permissions:
  contents: read

# Pull request only: a newer push replaces the run in progress.
concurrency:
  group: start-page-${{ github.ref }}
  cancel-in-progress: true
jobs:
  start-page-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Webview typechecks shared App protocols, which consume Service packages.
      - name: Bootstrap pinned private Service packages
        env:
          GH_TOKEN: ${{ secrets.HYPEPROOF_READ_TOKEN }}
        run: node scripts/bootstrap-service-packages.mjs
      - run: npm ci --ignore-scripts --omit=optional
        working-directory: extensions/hypeproof-chat
      - run: npm ci
        working-directory: extensions/hypeproof-chat/webview-ui
      - run: npm run build
        working-directory: extensions/hypeproof-chat/webview-ui
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:start-page
        working-directory: e2e
      - run: npm run test:trial-ux
        working-directory: e2e
      - run: npm run test:voice:popup
        working-directory: e2e
      # AE-01 (#554): the learner's goal over time in the built webview (late lesson, answers, typed text).
      - run: npm run test:goal:browser
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: start-page-evidence
          path: |
            e2e/test-results/start-page/
            e2e/test-results/trial-ux/
            e2e/test-results/voice-popup/
            e2e/test-results/goal-browser/
          retention-days: 14
