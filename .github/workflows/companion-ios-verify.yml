name: Companion iOS verification
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/companion-ios/**'
      - 'e2e/companion-ios/**'
      - '.github/workflows/companion-ios-verify.yml'
permissions:
  contents: read
concurrency:
  group: companion-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-simulator:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'companion-ios-verify')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Core protocol controls
        run: bash e2e/companion-ios/core-checks.sh
      - name: Simulator ownership controls
        run: python3 e2e/companion-ios/test_simulator_checks.py
      - name: Native iPhone and iPad simulator shell
        run: python3 e2e/companion-ios/simulator-checks.py
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-ios-simulator-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/companion-ios-simulator/devices.json
            artifacts/companion-ios-simulator/cleanup.json
            artifacts/companion-ios-simulator/*.xcresult
          if-no-files-found: warn
